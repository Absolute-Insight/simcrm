codecov:
  require_ci_to_pass: yes

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%

    patch:
      default:
        target: 85%
        threshold: 0%
        base: auto
        branches:
          - develop
        # `ignore` reported this status green whenever CI failed, which is the
        # one moment the number is least trustworthy. A coverage gate that
        # cannot fail is decoration.
        if_ci_failed: error
        only_pulls: true

comment:
  layout: "diff, files"
  require_changes: true
