services:
  mariadb:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  # Enable PostgreSQL only if you use it, see development/README.md for more information.
  # postgresql:
  #   image: postgres:11.8
  #   environment:
  #     POSTGRES_PASSWORD: 123
  #   volumes:
  #     - postgresql-data:/var/lib/postgresql/data

  redis-cache:
    image: redis:alpine

  redis-queue:
    image: redis:alpine

  redis-socketio:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: sleep infinity
    environment:
      - SHELL=/bin/bash
      # frontend/vite.config.js finds frappe's unpublished @framework/ui by
      # guessing where the bench sits relative to the repo. Neither guess can
      # reach a bench on a volume outside /workspace, and getting it wrong is not
      # a build failure -- it is a bundle of silent no-ops -- so name it here.
      - FRAPPE_UI_SRC=/home/frappe/frappe-bench/apps/frappe/ui/src
    volumes:
      - ..:/workspace:cached
      # The bench is a build artefact, not source, so it lives on its own volume
      # rather than in the bind-mounted repo. Three things follow from that.
      #  1. It survives "Rebuild Container" without landing ~1.5GB of apps/frappe,
      #     env/ and sites/ in `git status`.
      #  2. apps/crm can symlink to /workspace without folding the repo back into
      #     itself -- with the bench inside /workspace that link made
      #     /workspace/frappe-bench/apps/crm/frappe-bench/... infinite, which any
      #     tree walk that does not honour .gitignore will happily follow.
      #  3. It shares a lifecycle with mariadb-data: `docker compose down -v`
      #     drops both, so the bench and the database it points at cannot skew.
      #     Wiping only one is what leaves `bench new-site` failing on "database
      #     already exists".
      - bench-data:/home/frappe/frappe-bench
      # Docker-outside-of-docker: talk to the host's daemon rather than running
      # one in here. Without it `deploy/docker-compose.yml` -- the production
      # stack this repo ships -- cannot be brought up from inside the
      # devcontainer at all, so an image can be checked for its contents and
      # never actually booted. That gap is how every published image from
      # v2.0.0 to v3.1.4 shipped with frappe and no CRM app in it.
      #
      # The CLI that uses this socket comes from the docker-outside-of-docker
      # feature in devcontainer.json; the mount has to be declared here because
      # a feature's own `mounts` are not applied to compose-based devcontainers.
      #
      # TWO THINGS TO KNOW.
      #  1. Reaching this socket is root on the host. Fine for a personal dev
      #     box, not a claim to make quietly.
      #  2. If /var/run/docker.sock does not exist on the host, compose creates
      #     an empty *directory* at that path instead and every docker command
      #     fails with a confusing error. Check first, on the host:
      #         ls -l /var/run/docker.sock
      #     Docker Desktop with WSL integration and a native docker-ce inside
      #     WSL both put it there; if yours is elsewhere, change the left side.
      #
      # Containers started from in here are siblings, not children: they land on
      # the host's docker, and published ports appear on the host. Bind-mount
      # paths would be resolved by the host daemon against the host filesystem,
      # not against /workspace -- deploy/docker-compose.yml uses only named
      # volumes, so it is unaffected, but anything with a `-v` needs care.
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /home/frappe/frappe-bench
    ports:
      - 8000-8005:8000-8005
      - 9000-9005:9000-9005
      # vite dev server (frontend/yarn dev)
      - 8080:8080
    # Expose the host GPU to the container. The NVIDIA Container Toolkit injects
    # the host driver libraries and nvidia-smi at runtime -- do NOT install an
    # NVIDIA driver inside the container, and never inside WSL itself.
    #   `utility` -> nvidia-smi,  `compute` -> CUDA.
    # Decisive host-side check:  docker run --rm --gpus all ubuntu nvidia-smi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]

volumes:
  mariadb-data:
  bench-data:
  postgresql-data: