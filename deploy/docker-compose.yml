# Production stack for Vectora (this repo's CRM build).
#
# Consumes the image that .github/workflows/builds.yml publishes on every push
# to main: ghcr.io/absolute-insight/simcrm. The layout is frappe_docker's
# canonical production shape — one image, many roles — so anyone who has run a
# Frappe app in containers will recognise every service here:
#
#   configurator  one-shot: points the bench at db/redis (idempotent)
#   create-site   one-shot: creates the site on first boot, skips after;
#                 enables the scheduler every run (idempotent)
#   backend       gunicorn (the image's default command)
#   frontend      nginx serving built assets, proxying /api and /socket.io
#   websocket     socketio server (realtime: suggestion inbox pushes)
#   queue-*       background workers (automation, emails)
#   scheduler     cron ticks — the hourly signal run, deal-health scoring,
#                 and the daily digest live here; without it the proactive
#                 tier is silent
#
# Every long-running service waits for create-site to complete, so a fresh
# `docker compose up -d` serves nothing until the site exists, and every
# service carries a memory/cpu ceiling sized for the 4 GB host README.md
# describes. Raise them together if the host is bigger.
#
# Copy .env.example to .env, set the secrets, then: docker compose up -d
# See README.md in this directory for first boot, upgrades and backups.

name: vectora

# Bounded container logs. Without a limit the json-file driver grows without
# end and a chatty worker fills the host disk before anything alerts.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app: &app
  # No default tag on purpose: a stack that silently tracks `:stable` cannot
  # say what it is running. Pin a release in .env.
  image: ${VECTORA_IMAGE:-ghcr.io/absolute-insight/simcrm}:${VECTORA_TAG:?set VECTORA_TAG in .env (a release tag, e.g. v3.0.0)}
  restart: unless-stopped
  logging: *logging
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully
    create-site:
      condition: service_completed_successfully

services:
  db:
    # Pinned by DIGEST, not by tag. `mariadb:10.6` is a moving pointer: its
    # digest changed between 2026-09-08 and 2026-09-10, so the routine
    # `docker compose up -d` in the upgrade runbook recreated the production
    # database container with a cold restart in the middle of the day -- for an
    # operator who was only changing a proxy setting. Worse, the day that tag
    # moves to 10.6.29 the engine upgrades in place, unrehearsed, with no backup
    # taken. A digest cannot move.
    #
    # The tag is kept beside it so the file still says which version this is;
    # docker resolves the digest and ignores the tag. Bumping it is a deliberate
    # act with a backup in front of it -- see "Bumping the database image" in
    # README.md.
    #
    # DB_IMAGE in .env overrides it, and that is the 10.6 -> 11.4 upgrade switch
    # (README.md, "Upgrading MariaDB to 11.4"). Unset, this resolves to exactly
    # the image it did before the variable existed, so the service's config hash
    # is unchanged and the next unrelated `up -d` does not touch the database.
    image: ${DB_IMAGE:-mariadb:10.6.28@sha256:c7d726a1c0d29e486a1ab4ef0c76c75431a11428e76c50e99ba32106cea04114}
    # Optional, and absent until the upgrade: a db.env beside this file holding
    # MARIADB_AUTO_UPGRADE=1 makes the image's entrypoint back up the system
    # schema and run mariadb-upgrade on the first start after a version change.
    # A file rather than an `environment:` line because a new key there --
    # even an empty one -- changes the hash and recreates the running database.
    env_file:
      - path: ./db.env
        required: false
    logging: *logging
    restart: unless-stopped
    healthcheck:
      # The image's own script, with no password anywhere near it. The old check
      # was `mysqladmin ping --password=$DB_ROOT_PASSWORD`, which contradicted
      # this file's own rule about secrets on command lines: it put the
      # production root password in the host's process table once a second and
      # in `docker inspect db` forever. It did not even work as a check --
      # `mysqladmin ping` exits 0 on "access denied", so it went green on a
      # server that would refuse every real connection. healthcheck.sh
      # authenticates over the unix socket as the container's own user, and
      # --innodb_initialized is the part that says recovery finished.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      # After a crash on a real dataset InnoDB recovery takes minutes, not
      # seconds. The old `interval: 1s, retries: 20` with no start_period gave
      # recovery exactly 20 seconds before the container was declared unhealthy,
      # `up -d` aborted with "dependency failed to start", and every app service
      # stayed down until someone intervened. This tolerates ~160s (60s of grace
      # plus 20 × 5s); raise start_period if your database is large enough to
      # need it.
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      # The stock image leaves InnoDB on its 128 MB default, so in a 1 GB
      # container nine tenths of the memory it was given sat unused while every
      # read past the first 128 MB of hot pages went to disk. 384M is well
      # under half the limit on purpose: the pool is not all MariaDB allocates
      # (per-connection sort and join buffers, the table cache, in-memory
      # temporary tables), and a database that is OOM-killed is a far worse
      # outcome than one that reads from disk. Raise it together with
      # DB_MEMORY_LIMIT, keeping the pool at or below about half of the limit
      # -- see "Sizing the database" in README.md for what to measure first.
      # It changes no data on disk; it takes effect when the container is next
      # recreated.
      - --innodb-buffer-pool-size=${DB_INNODB_BUFFER_POOL_SIZE:-384M}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}
          cpus: "1.5"

  redis-cache:
    # By digest, for the reason `db` is: `6.2-alpine` is a moving tag, and a
    # tag that moved is an unannounced recreate on the next `up -d`. Resolved
    # 2026-11-13 (6.2.24) with
    #   docker buildx imagetools inspect redis:6.2-alpine --format '{{.Manifest.Digest}}'
    image: redis:6.2-alpine@sha256:3f9c6e23ed6bea3b41d0ef709fc164c1a0b7c00d5a21a60e0e9c33ada5496881
    logging: *logging
    restart: unless-stopped
    # No `command`, on purpose: the image's bare redis-server, which means no
    # maxmemory, no eviction, and the default snapshots to /data. It looks like
    # an oversight in a service called "cache" -- bench's own redis_cache.conf
    # sets a ceiling with allkeys-lru and turns snapshots off -- and it is not
    # one here. The Acumatica in-flight markers and the event-reminder ledger
    # now live in the database (CRM ERP Write, CRM Event Reminder Sent); what
    # persistence still protects is the shared Acumatica API token, the
    # customer-push sweep's bookmark and -- for the one release whose migrate
    # carries them into those tables -- the legacy acumatica_inflight::* and
    # crm:event_reminder_sent:* keys. An upgrade from an older release must
    # find them after the restart that comes with it.
    #
    # So until the release after that, this service must not get a
    # maxmemory-policy that evicts and must keep writing snapshots.
    # .github/helper/test-deploy-compose.sh fails if either changes.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  redis-queue:
    image: redis:6.2-alpine@sha256:3f9c6e23ed6bea3b41d0ef709fc164c1a0b7c00d5a21a60e0e9c33ada5496881
    logging: *logging
    restart: unless-stopped
    # Append-only, not the default snapshot rules. This instance holds the job
    # queue and the socketio channel: with RDB alone a crash or an OOM at the
    # 256m ceiling silently drops up to a minute of enqueued work -- queued
    # email, automation actions, an ERP sync somebody pressed Sync Now for.
    #
    # No maxmemory and no eviction policy here, deliberately: on this instance
    # an evicted key is a job that never runs. (redis-cache has neither as
    # well, for its own reason -- see the comment on that service.)
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  configurator:
    <<: *app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    # apps.txt lives on the sites volume, which docker seeds from the image once
    # and never again, so a new app in a new image stays unknown to frappe and
    # `install-app` refuses it as "not in apps.txt". Rewritten on every boot,
    # the way frappe_docker's own configurator does it.
    command:
      - >
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
        ls -1 apps > sites/apps.txt;
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  create-site:
    <<: *app
    restart: on-failure
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    # Secrets reach the shell through the environment, not this file's command:
    # `docker compose config` and `docker inspect` print the command verbatim.
    #
    # That is as far as it goes, and this comment used to claim more. The shell
    # then expands both passwords into `bench new-site`'s argv, where they are
    # readable in the host's process table (`ps`, `docker top`) for as long as
    # the site takes to create -- once, on first boot. bench offers no other
    # supported way in: neither option reads an environment variable, and the
    # alternatives are a prompt answered over stdin or `root_password` /
    # `admin_password` written into common_site_config.json, which puts the
    # database root password on the sites volume every service mounts. So
    # first boot is a moment to keep other users off the host, and README.md
    # says so.
    environment:
      SITE_NAME: ${SITE_NAME:?set SITE_NAME in .env}
      # Optional. The public URL frappe builds absolute links from -- password
      # resets, invitations, share links. Unset, frappe takes it from the Host
      # header of whichever request triggered the email. See "host_name" in
      # README.md.
      SITE_HOST_NAME: ${SITE_HOST_NAME:-}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # Read by crm.agent.install.apply_endpoint_defaults during after_install,
      # and only there. The shipped base URL is localhost, which is correct for a
      # bench on a laptop and wrong in a compose network where the inference
      # server is a sibling service -- so without this the local-model profile
      # pulled several GB of weights that no code path could reach. Seeded once,
      # never re-applied, so an admin who changes the endpoint in Settings keeps
      # their change across upgrades.
      VECTORA_AGENT_BASE_URL: ${VECTORA_AGENT_BASE_URL:-http://ollama:11434/v1}
      VECTORA_AGENT_MODEL: ${VECTORA_AGENT_MODEL:-hf.co/LiquidAI/LFM2.5-2.6B-GGUF:Q4_K_M}
      VECTORA_AGENT_ENABLED: ${VECTORA_AGENT_ENABLED:-0}
    entrypoint: ["bash", "-c"]
    # `bench new-site` writes enable_scheduler=0 into the new site's config, so
    # without the enable-scheduler step every cron job in crm/hooks.py -- the
    # hourly signal run, deal-health scoring, the digest -- is silent and
    # nothing logs an error. It runs on every boot, outside the skip branch,
    # because it is idempotent and a site restored from a backup carries
    # whatever the origin had.
    command:
      - |
        set -e
        wait-for-it -t 120 db:3306
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379

        site="$$SITE_NAME"
        # This script removes a directory by this name in one branch below, so
        # the name is checked first: empty, a path, or a dotfile would aim that
        # at the sites volume itself.
        case "$$site" in
          ""|.*|*/*|assets)
            echo "[create-site] refusing: SITE_NAME '$$site' is not a usable site name" >&2
            exit 1 ;;
        esac
        config="sites/$$site/site_config.json"
        # Present from just before `bench new-site` until just after it
        # succeeds, and at no other time. It is what tells an unfinished first
        # boot from a real site: the test used to be "does the directory
        # exist", and new-site makes the directory first -- so a create that
        # was killed partway (the 1g limit, a host reboot) left a directory
        # that every retry mistook for a site. It skipped the create, failed
        # at enable-scheduler against a database that was never made, and
        # restarted into the same thing for ever, with the whole stack waiting
        # on it.
        marker="sites/.creating-$$site"

        # What the DATABASE says about a site whose create was interrupted.
        # Prints one word:
        #   absent     no such database, or one without frappe's tables
        #   partial    frappe's tables, but not every app this create installs
        #   installed  every app is recorded as installed
        #   unknown    could not be asked -- the server did not answer, or the
        #              config names no database
        # Only the first two are evidence that nothing of value exists. A
        # question that was not answered is not an answer: an earlier version
        # of this asked `bench list-apps`, discarded its errors, and removed
        # the site directory -- encryption key included -- when a healthy site
        # merely failed to reply.
        # The root password travels in MYSQL_PWD, not in argv.
        db_verdict() {
          db=$$(sed -n 's/.*"db_name": *"\([A-Za-z0-9_]*\)".*/\1/p' "$$config" | head -n 1)
          if [ -z "$$db" ]; then echo unknown; return; fi
          has_tables=$$(MYSQL_PWD="$$DB_ROOT_PASSWORD" mariadb --host db --port 3306 --user root \
            --batch --skip-column-names --execute \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '$$db' AND table_name = 'tabDefaultValue'" \
            2>/dev/null) || { echo unknown; return; }
          case "$$has_tables" in
            0) echo absent; return ;;
            1) ;;
            *) echo unknown; return ;;
          esac
          apps=$$(MYSQL_PWD="$$DB_ROOT_PASSWORD" mariadb --host db --port 3306 --user root \
            --batch --skip-column-names --execute \
            "SELECT defvalue FROM \`$$db\`.tabDefaultValue WHERE parent = '__global' AND defkey = 'installed_apps'" \
            2>/dev/null) || { echo unknown; return; }
          for app in crm $$expected_apps; do
            case "$$apps" in
              *"\"$$app\""*) ;;
              *) echo partial; return ;;
            esac
          done
          echo installed
        }

        # frappe_whatsapp is inert until a WhatsApp Account is set Active.
        # Tested for so that this file still boots an older image, which
        # does not contain it.
        whatsapp=""
        expected_apps=""
        if [ -d apps/frappe_whatsapp ]; then
          whatsapp="--install-app frappe_whatsapp"
          expected_apps="frappe_whatsapp"
        fi

        if [ -e "$$marker" ] && [ -e "sites/$$site" ]; then
          verdict=absent
          if [ -f "$$config" ]; then verdict=$$(db_verdict); fi
          case "$$verdict" in
            absent|partial)
              echo "[create-site] an earlier first boot of $$site never finished (its database is $$verdict) -- removing its partial directory and creating it again"
              if [ -f "$$config" ]; then
                echo "[create-site] the abandoned database, if any, is left in MariaDB under this name; drop it by hand once the site is up:"
                sed -n 's/.*"db_name": *"\([^"]*\)".*/[create-site]   \1/p' "$$config"
              fi
              rm -rf "sites/$$site"
              ;;
            *)
              # Either the create finished and was killed before the marker
              # was cleared, or it was killed in its last step, or the database
              # could not be asked. None of those is grounds to delete.
              echo "[create-site] sites/$$site carries the marker of an unfinished create ($$marker), but its database is '$$verdict', not provably missing or incomplete. Nothing was removed." >&2
              echo "[create-site] Look at it: docker compose run --rm --no-deps --entrypoint bench create-site --site $$site list-apps" >&2
              echo "[create-site] If the site is good, clear the marker:" >&2
              echo "[create-site]   docker compose run --rm --no-deps --entrypoint rm create-site $$marker" >&2
              echo "[create-site] If it is a failed first boot, remove both and bring the stack up again:" >&2
              echo "[create-site]   docker compose run --rm --no-deps --entrypoint rm create-site -rf sites/$$site $$marker" >&2
              exit 1
              ;;
          esac
        fi

        if [ -f "$$config" ]; then
          echo "Site $$site already exists — skipping create"
        elif [ -e "sites/$$site" ]; then
          # A directory with no site_config.json and no marker: this stack did
          # not start it, so it is not this stack's to delete -- it may hold
          # files somebody put there for a restore. Say so, rather than fail
          # at enable-scheduler with an error about a missing database.
          echo "[create-site] sites/$$site exists but holds no site_config.json, so it is not a site, and bench new-site refuses a directory that already exists." >&2
          echo "[create-site] If nothing in it is wanted, remove it and bring the stack up again:" >&2
          echo "[create-site]   docker compose run --rm --no-deps --entrypoint rm create-site -rf sites/$$site" >&2
          exit 1
        else
          : > "$$marker"
          bench new-site "$$site" \
            --mariadb-user-host-login-scope='%' \
            --db-root-password="$$DB_ROOT_PASSWORD" \
            --admin-password="$$ADMIN_PASSWORD" \
            --install-app crm $$whatsapp
          rm -f "$$marker"
        fi
        bench --site "$$site" enable-scheduler
        # Frappe deletes backups older than keep_backups_for_hours on every
        # `bench backup`, and the default is 23 -- so the pre-upgrade backup
        # step in the runbook silently destroyed yesterday's. A week is the
        # floor worth having: long enough that a Monday mistake is still
        # recoverable on Friday.
        bench --site "$$site" set-config -p keep_backups_for_hours 168
        # Only when the operator asked for it; an unset variable leaves
        # whatever the site already has, including a host_name set by hand.
        if [ -n "$${SITE_HOST_NAME:-}" ]; then
          case "$$SITE_HOST_NAME" in
            http://*|https://*)
              bench --site "$$site" set-config host_name "$${SITE_HOST_NAME%/}" ;;
            *)
              echo "[create-site] SITE_HOST_NAME must start with http:// or https:// -- host_name left as it was" >&2 ;;
          esac
        fi
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  # Nightly backups. Until this existed the only backup on a Vectora host was
  # the one an operator remembered to take before an upgrade -- and because
  # frappe prunes on every run, taking that one destroyed the previous. A rep
  # bulk-deleting deals on Monday was unrecoverable by Tuesday.
  #
  # A loop rather than cron: the image has no crond, and a container whose only
  # job is to sleep and run one command is easier to reason about than a
  # scheduler inside a scheduler. It shares the sites volume with the backend,
  # so the dumps land where `bench restore` looks for them.
  backup:
    <<: *app
    restart: unless-stopped
    depends_on:
      create-site:
        condition: service_completed_successfully
    environment:
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      SITE_NAME: ${SITE_NAME:?set SITE_NAME in .env}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      # Optional dead-man's switch (healthchecks.io or anything that speaks
      # its protocol): GET <url>/start before each run, <url> after one that
      # worked, <url>/fail after one that did not. Unset = no pings. README.md,
      # "Being told when a backup did not happen".
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    # Is there a database dump younger than a day and a bit? The loop below can
    # only log a failure and sleep until tomorrow, and nothing reads that log
    # -- a full volume or a database that was down at 02:00 left the container
    # `Up` and the newest backup quietly ageing. This turns that into a state
    # something can see: `docker compose ps` shows `unhealthy` about two hours
    # after a missed night. 26 hours is one nightly run plus slack for a slow
    # dump; a dump still being written counts, which is the direction to err.
    #
    # start_period is the same length on purpose. A site created today has no
    # backup until its first BACKUP_HOUR, and that is not a failure: until the
    # period ends a failing check reads `starting`, and the first passing one
    # ends it early. So an existing site goes healthy within a minute, and a
    # new one the morning after.
    #
    # Nothing in this stack alerts on it by itself: BACKUP_PING_URL above is the
    # push half, this is the pull half. See "Knowing when a backup did not
    # happen" in README.md.
    healthcheck:
      test:
        - CMD-SHELL
        # Whole hours only. Anything else -- 26.5, 26h, empty -- would be a
        # syntax error in the arithmetic and so a container that is unhealthy
        # for ever for a reason no log shows; it falls back to 26, and the
        # loop below says so once at start.
        - |
          h="$${BACKUP_MAX_AGE_HOURS:-26}"
          case "$$h" in ""|*[!0-9]*) h=26 ;; esac
          # "08" is all digits and still a syntax error below: a leading zero
          # makes the shell read it as octal.
          while [ "$${h#0}" != "$$h" ]; do h="$${h#0}"; done
          [ -n "$$h" ] || h=26
          # The space after `find` is load-bearing: without it this was one
          # word, "command not found", swallowed by the 2>/dev/null -- and a
          # check that could never pass. The compose test now runs it against
          # a real dump.
          find "/home/frappe/frappe-bench/sites/$$SITE_NAME/private/backups" -name "*-database*.sql.gz" -mmin "-$$(( h * 60 ))" 2>/dev/null | grep -q .
      interval: 300s
      timeout: 30s
      retries: 3
      # Fixed rather than derived from BACKUP_MAX_AGE_HOURS: compose parses this
      # as a duration, and a value it cannot parse would break every command
      # in this directory, not just this check.
      start_period: 26h
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -u
        case "$${BACKUP_MAX_AGE_HOURS:-26}" in
          ""|*[!0-9]*)
            echo "[backup] BACKUP_MAX_AGE_HOURS='$${BACKUP_MAX_AGE_HOURS:-}' is not a whole number of hours; the healthcheck is using 26" >&2 ;;
        esac

        # Dead-man's-switch pings. The URL's path is the secret (anyone who
        # has it can mark a run as passed), so it is never logged past the
        # host, and it reaches curl on stdin rather than in argv. A ping is
        # bounded at 15 seconds and its failure is logged and ignored: an
        # unreachable monitor must never cost a backup.
        ping_url="$${BACKUP_PING_URL:-}"
        ping_url="$${ping_url%/}"
        redact() {
          rest="$${1#*://}"; host="$${rest%%/*}"; host="$${host##*@}"
          printf '%s://%s/...' "$${1%%://*}" "$$host"
        }
        case "$$ping_url" in
          "") ;;
          *[[:space:]\"\\]*)
            echo "[backup] BACKUP_PING_URL contains whitespace, a quote or a backslash; pings are off" >&2
            ping_url="" ;;
          *"?"*|*"#"*)
            echo "[backup] BACKUP_PING_URL has a query string or fragment; pings are off. It must be a healthchecks.io-style URL that /start, /fail and /0 can be appended to (deploy/README.md, 'Being told when a backup did not happen')" >&2
            ping_url="" ;;
          http://*|https://*)
            echo "[backup] pinging $$(redact "$$ping_url") at the start and end of each run" ;;
          *)
            echo "[backup] BACKUP_PING_URL must start with http:// or https://; pings are off" >&2
            ping_url="" ;;
        esac
        hc_ping() {
          [ -n "$$ping_url" ] || return 0
          if ! printf 'url = "%s%s"\n' "$$ping_url" "$$1" \
            | timeout 15 curl -fsS -m 10 --retry 2 --retry-max-time 12 -o /dev/null -K - >/dev/null 2>&1; then
            echo "[backup] ping $$(redact "$$ping_url")$$1 did not get through (ignored)"
          fi
          return 0
        }

        while true; do
          # Sleep until the next BACKUP_HOUR, recomputed each pass so the
          # schedule survives a restart at any time of day.
          #
          # $$BACKUP_HOUR, not $${BACKUP_HOUR}: compose interpolates a single
          # $ everywhere in this file including inside command strings, so the
          # unescaped form was substituted at config time with whatever .env
          # had -- nothing -- leaving `date -d "today :00"`, an empty `next`,
          # and a loop that spun instead of sleeping.
          now=$$(date +%s)
          next=$$(date -d "today $$BACKUP_HOUR:00" +%s)
          [ "$$next" -le "$$now" ] && next=$$(date -d "tomorrow $$BACKUP_HOUR:00" +%s)
          if [ -z "$$next" ]; then
            echo "[backup] cannot work out the next run time; retrying in an hour"
            sleep 3600
            continue
          fi
          sleep $$((next - now))

          echo "[backup] $$(date -Is) starting"
          hc_ping /start
          # Taking the backup is all this service does. Getting it off the
          # host is the `backup-offsite` service below, on an image that
          # actually carries rclone.
          if bench --site all backup --with-files; then
            echo "[backup] $$(date -Is) done"
            hc_ping ""
          else
            echo "[backup] $$(date -Is) FAILED"
            hc_ping /fail
          fi
        done
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # Gets the nightly dumps off the machine they protect. A backup that only
  # exists on the host it is protecting is a copy: it survives a bad delete,
  # not a lost server, and losing the server is the case the customer actually
  # fears.
  #
  # Its own service rather than a step inside `backup`, because the app image
  # carries no rclone and adding one would put a release between an operator
  # and their first off-host copy. The official image is pinned by tag+digest
  # for the same reason the database is.
  #
  # It runs hourly and copies rather than syncs: `rclone copy` never deletes
  # at the destination, so the seven-day local retention does not propagate to
  # the archive, and a copy that failed at 02:00 is retried at 03:00 instead of
  # waiting a day. Re-copying is free -- rclone skips files already there.
  #
  # What it does NOT copy, unless told to: the `*-site_config_backup.json`
  # frappe writes beside every dump. That file is site_config.json verbatim --
  # `db_password` and `encryption_key` in plaintext -- and the dump next to it
  # holds every stored integration secret encrypted with that same key. Shipped
  # together to a third party's bucket they are the whole CRM to anyone who
  # can read the bucket. The price is that the encryption key must be kept
  # somewhere else for a restore onto a new host to be complete; README.md,
  # "Restoring onto a new host", is the procedure.
  #
  # Layout at the destination, BACKUP_TARGET being remote:bucket[/path]:
  #   <site>/                 dailies, unencrypted (no OFFSITE_CRYPT_PASSWORD)
  #   <site>.crypt/           dailies, encrypted
  #   monthly/<site>.crypt/   the first backup of each month, encrypted
  #   monthly/<site>/         the same, unencrypted (only if plaintext is accepted)
  # No prefix is a prefix of another, so each can carry its own bucket
  # lifecycle rule -- README.md, "Immutable copies, and how long they are kept".
  backup-offsite:
    image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    logging: *logging
    restart: unless-stopped
    profiles: ["offsite"]
    depends_on:
      create-site:
        condition: service_completed_successfully
    volumes:
      # Read-only: this service must never be able to damage the thing it is
      # archiving.
      - sites:/data/sites:ro
    environment:
      # The remote is defined entirely by environment, so there is no
      # rclone.conf to mount, template or keep in sync -- and no credentials
      # on disk in the compose directory.
      RCLONE_CONFIG_OFFSITE_TYPE: ${OFFSITE_TYPE:-b2}
      # `:-`, not `:?`. Compose interpolates every service's variables when it
      # parses the file, BEFORE it filters services by profile -- so a `:?`
      # here did not just guard this service, it made every `docker compose`
      # command in this directory fail on any stack without B2 credentials,
      # profile activated or not. It took out the QA stack and the release
      # smoke test in builds.yml, which is how v3.14.0 shipped an image that
      # was never booted. `docker compose config` reproduces it in one line.
      #
      # The requirement is real, so it moves to run time, where it can only
      # stop the service it belongs to -- see the guard at the top of command.
      RCLONE_CONFIG_OFFSITE_ACCOUNT: ${B2_ACCOUNT_ID:-}
      RCLONE_CONFIG_OFFSITE_KEY: ${B2_APPLICATION_KEY:-}
      # Where they land. The site name is part of the path so one bucket can
      # hold more than one deployment without them overwriting each other.
      BACKUP_TARGET: ${BACKUP_TARGET:-offsite:vecmbp}
      SITE_NAME: ${SITE_NAME:?}
      # Everything below is opt-in and off when unset; .env.example and the
      # README's "Getting them off the host" describe each.
      #
      # Client-side encryption: set a passphrase and the copies go through an
      # rclone `crypt` remote, so the bucket only ever holds ciphertext.
      # Unset, the copies still run, as they always have -- but every hourly
      # run logs a warning and the healthcheck reports it, until a passphrase
      # is set or OFFSITE_ALLOW_PLAINTEXT=1 accepts plaintext.
      OFFSITE_CRYPT_PASSWORD: ${OFFSITE_CRYPT_PASSWORD:-}
      OFFSITE_CRYPT_SALT: ${OFFSITE_CRYPT_SALT:-}
      OFFSITE_ALLOW_PLAINTEXT: ${OFFSITE_ALLOW_PLAINTEXT:-0}
      # 1 = also copy site_config_backup.json. Honoured only when the copies
      # are encrypted.
      OFFSITE_INCLUDE_SITE_CONFIG: ${OFFSITE_INCLUDE_SITE_CONFIG:-0}
      # Days to keep dailies at the destination; 0 = never delete there (the
      # default, and with it no delete is ever attempted). Prefer lifecycle
      # rules on the bucket and a key that cannot delete.
      OFFSITE_RETENTION_DAYS: ${OFFSITE_RETENTION_DAYS:-0}
      # How old the newest dump at the destination may be before this service
      # reports unhealthy. Two hours more than the backup's own 26: the copy
      # runs hourly and a night's files take a while to upload.
      OFFSITE_MAX_AGE_HOURS: ${OFFSITE_MAX_AGE_HOURS:-28}
      # Optional dead-man's switch, as BACKUP_PING_URL on `backup`, pinged
      # around every hourly run.
      OFFSITE_PING_URL: ${OFFSITE_PING_URL:-}
      # How long a start that cannot verify the passphrase canary waits before
      # exiting (and being restarted). Seconds.
      OFFSITE_START_RETRY_SECONDS: ${OFFSITE_START_RETRY_SECONDS:-900}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        # What a `:?` on the credentials used to do, but scoped to this service.
        # Only reachable when somebody actually activates the offsite profile.
        if [ -z "$${RCLONE_CONFIG_OFFSITE_ACCOUNT}" ] || [ -z "$${RCLONE_CONFIG_OFFSITE_KEY}" ]; then
          echo "[offsite] refusing to start: set B2_ACCOUNT_ID and B2_APPLICATION_KEY in .env to run the offsite profile" >&2
          exit 1
        fi
        src="/data/sites/$${SITE_NAME}/private/backups"
        base="$${BACKUP_TARGET%/}"
        dest="$${base}/$${SITE_NAME}"
        mdest="$${base}/monthly/$${SITE_NAME}"

        # --- Dead-man's-switch pings (OFFSITE_PING_URL) ---------------------------
        # Same protocol and rules as the `backup` service: <url>/start, <url>,
        # <url>/fail; 15 seconds at most; a failed ping is logged and ignored; the
        # URL is never logged past its host, because its path is the secret.
        ping_url="$${OFFSITE_PING_URL:-}"
        ping_url="$${ping_url%/}"
        redact() {
          rest="$${1#*://}"; host="$${rest%%/*}"; host="$${host##*@}"
          printf '%s://%s/...' "$${1%%://*}" "$$host"
        }
        case "$$ping_url" in
          "") ;;
          *[[:space:]\"\\]*)
            echo "[offsite] OFFSITE_PING_URL contains whitespace, a quote or a backslash; pings are off" >&2
            ping_url="" ;;
          *"?"*|*"#"*)
            echo "[offsite] OFFSITE_PING_URL has a query string or fragment; pings are off. It must be a healthchecks.io-style URL that /start, /fail and /0 can be appended to (deploy/README.md, 'Being told when a backup did not happen')" >&2
            ping_url="" ;;
          http://*|https://*)
            echo "[offsite] pinging $$(redact "$$ping_url") at the start and end of each hourly run" ;;
          *)
            echo "[offsite] OFFSITE_PING_URL must start with http:// or https://; pings are off" >&2
            ping_url="" ;;
        esac
        hc_ping() {
          [ -n "$$ping_url" ] || return 0
          if command -v curl >/dev/null 2>&1; then
            printf 'url = "%s%s"\n' "$$ping_url" "$$1" \
              | timeout 15 curl -fsS -m 10 -o /dev/null -K - >/dev/null 2>&1
          else
            # This image has no curl, and busybox wget takes a URL only on its
            # command line, where `ps` on the host shows it. rclone's http
            # backend takes it from the environment instead. It can only GET a
            # path BELOW the URL, so success is <url>/0 -- the exit-status form
            # of the same protocol (healthchecks.io: "/0" = success) -- not <url>.
            path="$${1#/}"
            [ -n "$$path" ] || path=0
            RCLONE_CONFIG_HCPING_TYPE=http RCLONE_CONFIG_HCPING_URL="$$ping_url/" RCLONE_CONFIG_HCPING_NO_HEAD=true \
              timeout 15 rclone cat "hcping:$$path" --contimeout 5s --timeout 10s --low-level-retries 1 -q >/dev/null 2>&1
          fi || echo "[offsite] ping $$(redact "$$ping_url")$$1 did not get through (ignored)"
          return 0
        }

        # --- Client-side encryption -------------------------------------------------
        # The crypt remotes are written to rclone's own config file rather than
        # exported, so that `docker compose exec backup-offsite rclone ...` and the
        # healthcheck see the same remotes this loop does. The passphrase goes to
        # `rclone obscure` on stdin, never as an argument. Encrypted copies get
        # prefixes of their own (<site>.crypt, monthly/<site>.crypt): a directory
        # holding both would hide the plaintext half from every listing made through
        # the crypt remote, and an operator switching on encryption must be able to
        # tell the two archives apart and age the old one out on its own.
        encrypted=0
        if [ -n "$${OFFSITE_CRYPT_PASSWORD}" ]; then
          umask 077
          pass=$$(printf '%s' "$${OFFSITE_CRYPT_PASSWORD}" | rclone obscure -) || pass=""
          if [ -z "$$pass" ]; then
            echo "[offsite] refusing to start: could not prepare OFFSITE_CRYPT_PASSWORD, and copying unencrypted instead is not what was asked for" >&2
            exit 1
          fi
          salt=""
          if [ -n "$${OFFSITE_CRYPT_SALT}" ]; then
            salt=$$(printf '%s' "$${OFFSITE_CRYPT_SALT}" | rclone obscure -) || salt=""
            if [ -z "$$salt" ]; then
              echo "[offsite] refusing to start: could not prepare OFFSITE_CRYPT_SALT" >&2
              exit 1
            fi
          fi
          stanza() {
            echo "[$$1]"
            echo "type = crypt"
            echo "remote = $$2"
            echo "password = $$pass"
            if [ -n "$$salt" ]; then echo "password2 = $$salt"; fi
            # Contents are encrypted; names are not, so the bucket's own console
            # still shows which nights are there.
            echo "filename_encryption = off"
            echo "directory_name_encryption = false"
            echo
          }
          conf="$$(rclone config file | tail -n 1)"
          mkdir -p "$$(dirname "$$conf")"
          { stanza offsitecrypt "$${dest}.crypt" && stanza offsitecryptmonthly "$${mdest}.crypt"; } > "$$conf" \
            || { echo "[offsite] refusing to start: cannot write $$conf" >&2; exit 1; }
          dest="offsitecrypt:"
          mdest="offsitecryptmonthly:"
          encrypted=1

          # The canary. A passphrase with a typo, or one rotated without moving
          # to a new prefix, would otherwise write into <site>.crypt/ under a
          # second key without a word -- and the half nobody can decrypt is
          # only discovered at restore time. So each crypt prefix holds a small
          # .vectora-canary written under its key: it must decrypt to the
          # expected text, or this service does not copy. A prefix with
          # encrypted files but no canary (written before it existed) must
          # decrypt its first file before a canary is added.
          #
          # Existence is asked with a LISTING, never inferred from `rclone cat`:
          # on B2, cat of a missing file falls back to listing an empty
          # "directory" and exits 0 with no output, which would read as a
          # wrong passphrase on every fresh prefix. A listing that fails is a
          # network or key problem, reported as such -- not as a passphrase.
          #
          # canary_check <crypt remote> <where, for messages>:
          #   0 verified (or created)   1 passphrase differs   2 could not check
          canary_name=.vectora-canary
          canary_text="vectora offsite canary: written under this prefix's passphrase"
          canary_err=/tmp/offsite.canary.err
          canary_check() {
            listing=$$(rclone lsf "$$1" --files-only 2>"$$canary_err")
            rc=$$?
            case "$$rc" in
              0) ;;
              3) listing="" ;;  # "directory not found": a prefix nothing was ever written to
              *) echo "[offsite] cannot list $$2 to check the passphrase canary (rclone exit $$rc: $$(tail -n 1 "$$canary_err")) -- a network or key problem, not the passphrase" >&2
                 return 2 ;;
            esac
            if printf '%s\n' "$$listing" | grep -qxF "$$canary_name"; then
              got=$$(rclone cat "$$1$$canary_name" 2>"$$canary_err")
              rc=$$?
              if [ "$$rc" = 0 ] && [ "$$got" = "$$canary_text" ]; then
                return 0
              fi
              if [ "$$rc" = 0 ] || grep -qiE 'authenticate|bad password|magic' "$$canary_err"; then
                echo "[offsite] $$2/$$canary_name does not decrypt to the expected text: OFFSITE_CRYPT_PASSWORD or OFFSITE_CRYPT_SALT differs from the one that wrote this prefix" >&2
                return 1
              fi
              echo "[offsite] cannot read $$2/$$canary_name (rclone exit $$rc: $$(tail -n 1 "$$canary_err")) -- a network or key problem, not the passphrase" >&2
              return 2
            fi
            one=$$(printf '%s\n' "$$listing" | grep -vxF "$$canary_name" | grep . | head -n 1)
            if [ -n "$$one" ] && ! rclone cat --head 1 "$$1$$one" >/dev/null 2>"$$canary_err"; then
              if grep -qiE 'authenticate|bad password|magic' "$$canary_err"; then
                echo "[offsite] $$2/$$one does not decrypt with this OFFSITE_CRYPT_PASSWORD/OFFSITE_CRYPT_SALT; put the old values back, or point the copies at a new prefix" >&2
                return 1
              fi
              echo "[offsite] cannot read $$2/$$one to check the passphrase ($$(tail -n 1 "$$canary_err")) -- a network or key problem, not the passphrase" >&2
              return 2
            fi
            if ! printf '%s' "$$canary_text" | rclone rcat "$$1$$canary_name" 2>"$$canary_err" \
              || [ "$$(rclone cat "$$1$$canary_name" 2>>"$$canary_err")" != "$$canary_text" ]; then
              echo "[offsite] could not write and read back $$2/$$canary_name ($$(tail -n 1 "$$canary_err"))" >&2
              return 2
            fi
            echo "[offsite] wrote and verified the passphrase canary $$2/$$canary_name"
            return 0
          }
          # A refusal waits before exiting: `restart: unless-stopped` would
          # otherwise restart it at once, and a wrong passphrase or a bucket
          # that is unreachable for an hour would hammer B2 and the monitor
          # every few seconds. One log line and one /fail ping per attempt.
          wait="$${OFFSITE_START_RETRY_SECONDS:-900}"
          case "$$wait" in ""|*[!0-9]*) wait=900 ;; esac
          verdict=0
          canary_check offsitecrypt: "$${base}/$${SITE_NAME}.crypt" || verdict=$$?
          if [ "$$verdict" = 0 ]; then
            canary_check offsitecryptmonthly: "$${base}/monthly/$${SITE_NAME}.crypt" || verdict=$$?
          fi
          case "$$verdict" in
            0) ;;
            1) echo "[offsite] NOT COPYING: the passphrase does not match the archive it would write into. Fix .env (deploy/README.md, 'Encrypting the copies'); checking again in $${wait}s." >&2
               hc_ping /fail
               sleep "$$wait"
               exit 1 ;;
            *) echo "[offsite] NOT COPYING YET: could not check the passphrase canary (see above); retrying in $${wait}s." >&2
               hc_ping /fail
               sleep "$$wait"
               exit 1 ;;
          esac
        fi
        # Not encrypted is allowed -- a stack that predates OFFSITE_CRYPT_PASSWORD
        # keeps working exactly as before -- but it is never quiet: every hourly run
        # says so, and the healthcheck reports it until a passphrase is set or the
        # operator accepts plaintext with OFFSITE_ALLOW_PLAINTEXT=1.
        warn_plaintext() {
          if [ "$${OFFSITE_ALLOW_PLAINTEXT:-0}" = "1" ]; then
            echo "[offsite] WARNING: copies leave this host UNENCRYPTED (accepted: OFFSITE_ALLOW_PLAINTEXT=1)" >&2
          else
            echo "[offsite] WARNING: copies leave this host UNENCRYPTED. Anyone who can read the bucket can read every customer record. Set OFFSITE_CRYPT_PASSWORD -- deploy/README.md, 'Encrypting the copies'." >&2
          fi
        }

        # For the healthcheck, and for anyone looking by hand:
        #   docker compose exec backup-offsite sh -c 'rclone ls "$$(cat /tmp/offsite.dest)"'
        #   docker compose exec backup-offsite cat /tmp/offsite.status
        printf '%s\n' "$$dest" > /tmp/offsite.dest

        # The filter, as the positional parameters: sh has no arrays. --filter rather
        # than --exclude so the monthly copy below can add its own rules after it
        # without mixing the two flag kinds (rclone warns about that).
        set -- --filter "- *site_config_backup*"
        if [ "$${OFFSITE_INCLUDE_SITE_CONFIG}" = "1" ]; then
          if [ "$$encrypted" = "1" ]; then
            set --
          else
            echo "[offsite] OFFSITE_INCLUDE_SITE_CONFIG=1 ignored: site_config_backup.json holds the encryption key and is only copied when OFFSITE_CRYPT_PASSWORD is set" >&2
          fi
        fi

        # --- Retention ----------------------------------------------------------------
        # Off unless OFFSITE_RETENTION_DAYS is set: with it unset this service never
        # issues a delete of any kind. The recommended setup is a key that cannot
        # delete and lifecycle rules on the bucket (README.md, "Immutable copies");
        # against such a key a prune is refused, and that is reported once as
        # "delegated", not as a failure. Whole days only, and never fewer than 14:
        # the host keeps a week, so anything shorter deletes a file here that the next
        # hourly copy would upload again. Dailies only -- monthly/ is never pruned here.
        keep="$${OFFSITE_RETENTION_DAYS}"
        case "$$keep" in
          ""|*[!0-9]*)
            echo "[offsite] OFFSITE_RETENTION_DAYS='$$keep' is not a whole number of days; nothing will be deleted at the destination" >&2
            keep=0 ;;
        esac
        while [ "$${keep#0}" != "$$keep" ]; do keep="$${keep#0}"; done
        [ -n "$$keep" ] || keep=0
        if [ "$$keep" -gt 0 ] && [ "$$keep" -lt 14 ]; then
          echo "[offsite] OFFSITE_RETENTION_DAYS=$$keep is below the minimum of 14; nothing will be deleted at the destination" >&2
          keep=0
        fi
        prune=off
        [ "$$keep" -gt 0 ] && prune=script

        prune_old() {
          # Only while fresh dumps are arriving: an archive that has stopped
          # receiving is the last copy there is, and must not be aged away.
          if ! rclone lsf "$$dest" --files-only --max-age "$${OFFSITE_MAX_AGE_HOURS}h" --include "*-database*.sql.gz" 2>/dev/null | grep -q .; then
            echo "[offsite] $$(date -Is) not pruning: no dump newer than $${OFFSITE_MAX_AGE_HOURS}h at the destination"
            return 0
          fi
          if out=$$(rclone delete "$$dest" --min-age "$${keep}d" --exclude .vectora-canary --log-level NOTICE --stats 0 2>&1); then
            if [ -n "$$out" ]; then printf '%s\n' "$$out"; fi
            echo "[offsite] $$(date -Is) pruned dailies older than $${keep}d"
            prune=script
            return 0
          fi
          printf '%s\n' "$$out"
          if printf '%s\n' "$$out" | grep -qiE 'unauthori[sz]ed|not.?authori[sz]ed|access.?denied|forbidden|not.?allowed|insufficient|capabilit|permission|object.?lock|retention|(^|[^0-9])(401|403)([^0-9]|$$)'; then
            echo "[offsite] $$(date -Is) pruning is delegated to the bucket's lifecycle rules: this key may not delete, which is the recommended setup. OFFSITE_RETENTION_DAYS is ignored from now on; unset it to silence this."
            prune=delegated
            keep=0
            return 0
          fi
          echo "[offsite] $$(date -Is) PRUNE FAILED"
          prune=failed
          return 1
        }

        # --- Monthly tier ---------------------------------------------------------------
        # The first complete backup of each month is copied once more, to monthly/,
        # so that a lifecycle rule can keep it for a year while the dailies age out
        # after a month. "Complete" means nothing in its set changed in the last hour
        # (the tars are written after the dump). "First" means the earliest of this
        # month still on the host -- the host keeps a week, so if this service was
        # down for the 1st, the month's copy is the first night it can see.
        #
        # Once a month, and completely: the month is done only when a copy of
        # its set has exited 0. If monthly/ already holds a dump for the month
        # (a restart, or a copy that died after the dump and before the tars),
        # that SAME set is copied again -- rclone skips what is there and
        # uploads what is missing -- rather than a later night starting a
        # second one.
        #
        # Encrypted copies only (or plaintext that OFFSITE_ALLOW_PLAINTEXT=1
        # accepted): a stack that predates the passphrase keeps doing exactly
        # what it did, and does not start keeping a year of plaintext dumps in
        # a third party's bucket because it was upgraded.
        monthly_done=""
        monthly_on=1
        if [ "$$encrypted" != "1" ] && [ "$${OFFSITE_ALLOW_PLAINTEXT:-0}" != "1" ]; then
          monthly_on=0
          monthly_done="off (copies not encrypted)"
        fi
        monthly_copy() {
          [ "$$monthly_on" = "1" ] || return 0
          month=$$(date +%Y%m)
          [ "$$monthly_done" = "$$month" ] && return 0
          stamps="s/^\($${month}[0-3][0-9]_[0-9]\{6\}\)-.*-database\(-enc\)\{0,1\}\.sql\.gz$$/\1/p"
          rclone lsf "$$mdest" --files-only --include "$${month}*-database*" > /tmp/offsite.monthly 2>/dev/null
          rc=$$?
          # 3 is rclone's "directory not found": the first monthly copy ever.
          case "$$rc" in
            0|3) ;;
            *) echo "[offsite] $$(date -Is) monthly: cannot list $$mdest (exit $$rc); retrying next hour"
               return 1 ;;
          esac
          first=$$(grep -v -- '-partial-database' /tmp/offsite.monthly | sed -n "$$stamps" | sort | head -n 1)
          if [ -n "$$first" ]; then
            if ! ls "$$src" 2>/dev/null | grep -q "^$${first}-"; then
              echo "[offsite] $$(date -Is) monthly: the $$first set at $$mdest is no longer on this host to complete; leaving it as it is"
              monthly_done="$$month"
              return 0
            fi
          else
            first=$$(ls "$$src" 2>/dev/null | grep -v -- '-partial-database' | sed -n "$$stamps" | sort | head -n 1)
            [ -n "$$first" ] || return 0
          fi
          if find "$$src" -maxdepth 1 -name "$${first}-*" -mmin -60 | grep -q .; then
            return 0
          fi
          if rclone copy "$$src" "$$mdest" "$$@" --filter "+ $${first}-*" --filter "- *" --log-level NOTICE --stats 0; then
            echo "[offsite] $$(date -Is) monthly: copied the $$first set to $$mdest"
            monthly_done="$$month"
            return 0
          fi
          echo "[offsite] $$(date -Is) MONTHLY COPY FAILED"
          return 1
        }

        write_status() {
          {
            if [ "$$encrypted" = "1" ]; then echo "encryption=on"; else echo "encryption=off"; fi
            echo "plaintext_accepted=$${OFFSITE_ALLOW_PLAINTEXT:-0}"
            echo "prune=$$prune"
            echo "monthly=$$monthly_done"
            echo "last_run=$$(date -Is)"
            echo "last_result=$$1"
            echo "last_ok=$$last_ok"
          } > /tmp/offsite.status.new && mv /tmp/offsite.status.new /tmp/offsite.status
        }

        if [ "$$encrypted" = "1" ]; then
          where="$${base}/$${SITE_NAME}.crypt, encrypted"
          mwhere="$${base}/monthly/$${SITE_NAME}.crypt"
        else
          where="$${base}/$${SITE_NAME}, NOT encrypted"
          mwhere="$${base}/monthly/$${SITE_NAME}"
        fi
        [ "$$monthly_on" = "1" ] || mwhere="nowhere: the monthly tier needs encrypted copies"
        echo "[offsite] copying $$src -> $$where, hourly; the first backup of each month also -> $$mwhere (retention=$${keep}d, 0 = keep everything)"
        if [ "$$#" -gt 0 ]; then
          echo "[offsite] NOT copied: *site_config_backup.json (it holds the site's encryption_key and db_password). Keep the key somewhere else -- deploy/README.md, 'What is not copied' and 'Restoring onto a new host'."
        fi
        last_ok=""
        while true; do
          [ "$$encrypted" = "1" ] || warn_plaintext
          if [ -d "$$src" ]; then
            hc_ping /start
            result=ok
            # --min-age: leave a dump that is still being written for the next run.
            # Uploaded half-written it would fail the run, and on a bucket with
            # Object Lock it would sit there, locked, for the whole retention period.
            if rclone copy "$$src" "$$dest" "$$@" --min-age 15m --log-level NOTICE --stats 0; then
              echo "[offsite] $$(date -Is) ok"
              last_ok=$$(date -Is)
              monthly_copy "$$@" || result=fail
              if [ "$$keep" -gt 0 ]; then prune_old || result=fail; fi
            else
              echo "[offsite] $$(date -Is) COPY FAILED"
              result=fail
            fi
            write_status "$$result"
            if [ "$$result" = "ok" ]; then hc_ping ""; else hc_ping /fail; fi
          else
            echo "[offsite] $$(date -Is) no backups directory yet at $$src"
            write_status waiting
          fi
          sleep 3600
        done
    healthcheck:
      # Three questions, each printed when it fails (docker inspect shows the
      # output). Can this service still reach the bucket with the key it was
      # given? A silent credential expiry is the failure that leaves an
      # operator believing they have off-host copies when they stopped weeks
      # ago. Is the newest dump THERE recent? The key opening the bucket says
      # nothing about whether anything has arrived lately. And are the copies
      # encrypted? Unencrypted still copies, and is reported here so that it
      # reaches whatever watches this state rather than staying in a log.
      #
      # A host with no dump yet has nothing to be late with, so the second
      # question is only asked once the first local backup exists.
      test:
        - CMD-SHELL
        - |
          rclone lsd "$$BACKUP_TARGET" >/dev/null 2>&1 || { echo "cannot list $$BACKUP_TARGET with this key"; exit 1; }
          bad=0
          if ls "/data/sites/$$SITE_NAME/private/backups"/*-database*.sql.gz >/dev/null 2>&1; then
            dest=$$(cat /tmp/offsite.dest 2>/dev/null)
            [ -n "$$dest" ] || { echo "the copy loop has not started"; exit 1; }
            if ! rclone lsf "$$dest" --files-only --max-age "$${OFFSITE_MAX_AGE_HOURS:-28}h" --include "*-database*.sql.gz" 2>/dev/null | grep -q .; then
              echo "no database dump newer than $${OFFSITE_MAX_AGE_HOURS:-28}h at $$dest"
              bad=1
            fi
          fi
          if [ -z "$${OFFSITE_CRYPT_PASSWORD:-}" ] && [ "$${OFFSITE_ALLOW_PLAINTEXT:-0}" != "1" ]; then
            echo "copies are NOT encrypted: set OFFSITE_CRYPT_PASSWORD, or OFFSITE_ALLOW_PLAINTEXT=1 to accept plaintext"
            bad=1
          fi
          if grep -qx 'prune=failed' /tmp/offsite.status 2>/dev/null; then
            echo "pruning at the destination failed; see the log"
            bad=1
          fi
          [ "$$bad" = 0 ] && echo "ok"
          exit "$$bad"
      interval: 300s
      timeout: 60s
      retries: 3
      # Long enough for the first copy of a week of backups to land before a
      # missing dump counts against it. A passing check ends it early.
      start_period: 1h
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  backend:
    <<: *app
    healthcheck:
      # The Host header names the site: without it frappe has no site to
      # answer for and returns 404 even when gunicorn is perfectly healthy.
      test:
        [
          "CMD-SHELL",
          'curl -fsS -H "Host: ${SITE_NAME}" http://localhost:8000/api/method/ping || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"

  websocket:
    <<: *app
    healthcheck:
      # The socket server answers the engine.io handshake; if it does not, the
      # app loses its badges and live list refreshes with no error anywhere.
      test:
        [
          "CMD-SHELL",
          'curl -fsS "http://localhost:9000/socket.io/?EIO=4&transport=polling" >/dev/null || exit 1',
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  frontend:
    <<: *app
    # nginx looks up backend and websocket once, at start; the watcher reloads it
    # when either comes back on a new address -- nginx/upstream-watch.sh.
    command:
      [
        "bash",
        "-c",
        "bash /etc/nginx/vectora-upstream-watch.sh && exec nginx-entrypoint.sh",
      ]
    # Repeats x-app's two volumes on purpose: a `volumes:` key here replaces the
    # merged list outright rather than extending it, so dropping either line
    # takes the site data with it. The third adds the Service-Worker-Allowed
    # header the PWA needs -- see nginx/security_headers.conf for why a security
    # snippet is the place it goes.
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./nginx/security_headers.conf:/etc/nginx/snippets/security_headers.conf:ro
      # Defines $vectora_csp / $vectora_xfo in the http context, which is the
      # only place a `map` is allowed -- the snippet above is included inside
      # the generated server block.
      - ./nginx/csp_map.conf:/etc/nginx/conf.d/00-vectora-csp.conf:ro
      - ./nginx/upstream-watch.sh:/etc/nginx/vectora-upstream-watch.sh:ro
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?set SITE_NAME in .env}
      # Which peers nginx trusts to carry the client address in X-Forwarded-For.
      # The TLS proxy never arrives from 127.0.0.1: through Docker's published
      # port it appears as the compose network's gateway, and as a sibling
      # container it appears with its own address -- both in Docker's private
      # 172.16/12 space. With the old loopback default the header was never
      # honoured, every request reached frappe with the same address, and every
      # per-IP rate limit (the guest invitation acceptance most painfully) was
      # one bucket for the whole company. Only the proxy can reach this port, so
      # trusting the private range is trusting the proxy. Override in .env if
      # your proxy lives elsewhere.
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-172.16.0.0/12}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    # Loopback by default: the README's TLS section puts a reverse proxy on the
    # same host in front of this. Set HTTP_BIND_ADDRESS=0.0.0.0 in .env only
    # when something on another machine must reach this port directly.
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PUBLISH_PORT:-8080}:8080"
    healthcheck:
      # Through nginx to the backend, so a green check means routing works,
      # not only that nginx is listening. And the upstream watcher's heartbeat:
      # a dead watcher is otherwise invisible until the next address move 502s.
      test:
        [
          "CMD-SHELL",
          "curl -fsS -o /dev/null http://localhost:8080/api/method/ping && find /tmp/upstream-watch.beat -mmin -1 | grep -q . || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  queue-short:
    <<: *app
    healthcheck:
      # "Up" is not the same as "consuming". A worker that lost its redis
      # connection sits there looking healthy while the queue backs up -- and
      # the queues are where the hourly signal run, the digests and every ERP
      # push actually happen, so the failure is silent by construction.
      # rq lives in the bench virtualenv, not on PATH, and the summary line is
      # what says whether anything is actually registered -- `rq info` exits 0
      # against an empty pool too. Reported unhealthy on a working stack until
      # both of those were right, which is worse than no check at all.
      test:
        [
          "CMD-SHELL",
          '/home/frappe/frappe-bench/env/bin/rq info --url redis://redis-queue:6379 2>/dev/null | grep -qE "^[1-9][0-9]* workers"',
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["bench", "worker", "--queue", "short,default"]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"

  queue-long:
    <<: *app
    healthcheck:
      # "Up" is not the same as "consuming". A worker that lost its redis
      # connection sits there looking healthy while the queue backs up -- and
      # the queues are where the hourly signal run, the digests and every ERP
      # push actually happen, so the failure is silent by construction.
      # rq lives in the bench virtualenv, not on PATH, and the summary line is
      # what says whether anything is actually registered -- `rq info` exits 0
      # against an empty pool too. Reported unhealthy on a working stack until
      # both of those were right, which is worse than no check at all.
      test:
        [
          "CMD-SHELL",
          '/home/frappe/frappe-bench/env/bin/rq info --url redis://redis-queue:6379 2>/dev/null | grep -qE "^[1-9][0-9]* workers"',
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["bench", "worker", "--queue", "long,default,short"]
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1"

  scheduler:
    <<: *app
    healthcheck:
      # The scheduler going quiet is the failure this stack is least likely to
      # notice: nothing errors, the container stays up, and the hourly signal
      # run and the daily digest simply stop. A restore from backup can also
      # bring enable_scheduler=0 back with it.
      # `bench execute` prints a return value only when it is truthy, so the
      # healthy answer here is *no output*: is_scheduler_inactive returns False
      # when the scheduler is running, and False prints nothing. Grepping for
      # "False" therefore failed on a perfectly healthy scheduler. Inverted,
      # and the exit status is checked separately so a traceback cannot pass.
      test:
        [
          "CMD-SHELL",
          'cd /home/frappe/frappe-bench && out=$$(bench --site "${SITE_NAME}" execute frappe.utils.scheduler.is_scheduler_inactive 2>&1) || exit 1; case "$$out" in *True*) exit 1 ;; esac',
        ]
      interval: 300s
      timeout: 30s
      retries: 2
      start_period: 120s
    command: ["bench", "schedule"]
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # --- Local model, opt-in ----------------------------------------------------
  # docker compose --profile local-model up -d
  #
  # The agent tier is an HTTP client to any OpenAI-compatible endpoint, so it
  # does not care whether the model runs here, on another host, or at a vendor.
  # This profile exists so "run it on our own hardware" is a supported, tested
  # shape rather than something each operator reinvents. Without the profile
  # these two services are not created at all and the stack is unchanged.
  #
  # No memory ceiling here on purpose: the model's working set is the weights,
  # and a limit below them is an OOM-kill mid-answer. The README is explicit
  # that the 4 GB host running the rest of this stack cannot also host a model.
  # On a bigger host, size it to the model -- e.g. for LFM2.5-2.6B Q4 (1.7 GB):
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4g
  #         cpus: "4"
  # GPU: add a device reservation to `ollama` if the host has one --
  #   deploy:
  #     resources:
  #       reservations:
  #         devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  # CPU-only works but is slow enough that the agent timeout needs raising, and
  # the proxy ceiling with it. See README.md.
  ollama:
    image: ollama/ollama:0.40.4
    logging: *logging
    profiles: ["local-model"]
    restart: unless-stopped
    environment:
      # Weights unload between calls without this, and the first call after a
      # quiet period pays the reload before it answers.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      # The window the model actually gets. ollama's default is 4096, and the
      # Mentor and Assistant prompts -- grounding articles plus history -- run
      # past that on a fourth follow-up. ollama truncates from the head, which
      # is where the system instruction and the grounding live, and still
      # answers 200: the answer arrives ungrounded, with citation chips
      # pointing at articles the model never saw. Must agree with
      # `context_tokens` in CRM Agent Settings, which is what the prompts are
      # trimmed against.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: pull the weights, then make one throwaway call so the first real
  # request from a rep is a warm one. Idempotent -- a pull of a model already
  # present is a no-op, so `up -d` stays safe to re-run.
  ollama-pull:
    image: ollama/ollama:0.40.4
    logging: *logging
    profiles: ["local-model"]
    restart: on-failure
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${VECTORA_AGENT_MODEL:-hf.co/LiquidAI/LFM2.5-2.6B-GGUF:Q4_K_M}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling $$MODEL (first run downloads several GB)"
        ollama pull "$$MODEL"
        echo "Warming $$MODEL"
        ollama run "$$MODEL" "reply with the single word: ready" >/dev/null
        echo "Local model ready at http://ollama:11434/v1"
        echo "A site created with VECTORA_AGENT_ENABLED=1 is already pointed at it;"
        echo "otherwise switch the tier on in Settings -> Assistant."

  # --- GPU model, opt-in ------------------------------------------------------
  # docker compose --profile gpu-model up -d
  #
  # NVIDIA Nemotron 3.5 Bolt E4B (a post-trained Gemma 4 E4B; OpenMDW-1.1 over
  # Apache-2.0) on ollama, on one NVIDIA card of its own. One model for every
  # tier: summaries, drafts, the Analyst, the Assistant -- and, because it reads
  # audio and images, the Assistant's dictation and photo attachments. Use it
  # instead of `local-model`, not beside it: one model per stack. Measured on
  # 2026-11-16 against the MiniCPM-V-4.7-35B it replaces (deploy/README.md,
  # "A GPU host"): the same task probe, the injection corpus resisted with
  # thinking on, and transcription as good as Whisper's.
  #
  # The service keeps the name and port the llama.cpp server had, so a site
  # already pointed at http://llm:8086/v1 needs only its model name changed.
  #
  # Thinking is ON by default for this model and is switched off per request
  # (`reasoning_effort: none`): dictation always does so, and the other tiers
  # follow "Turn off model reasoning" in Settings -> Assistant -- leave it off,
  # because with reasoning the injection corpus never lands and without it one
  # case does. Thinking spends `max_tokens`: set it to 8192 there.
  #
  # `OLLAMA_CONTEXT_LENGTH` is the window *each* of the `OLLAMA_NUM_PARALLEL`
  # requests gets; `context_tokens` in CRM Agent Settings must not exceed it,
  # or ollama truncates the prompt from the head -- the instruction -- and
  # still answers 200. Four slots of 32768 hold ~11 GB of a 24 GB card.
  # Four matches the CRM's own cap on concurrent model calls.
  llm:
    image: ollama/ollama:0.40.16
    logging: *logging
    profiles: ["gpu-model"]
    restart: unless-stopped
    # Served only after llm-fetch has checked the model it will serve.
    depends_on:
      llm-fetch:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: 0.0.0.0:8086
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_CONTEXT_LENGTH: ${VECTORA_LLM_CONTEXT:-32768}
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - llm-ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  # One-shot, before `llm` starts: pull the pinned model with a private ollama
  # of its own, check every digest in its manifest -- the weights, the
  # audio/vision projector, the chat template and the parameters -- against
  # the pinned fingerprint, and only then let `llm` serve the volume. A tag on
  # a registry can be re-pointed; a model is code that writes to customers, so
  # one that does not match the measured one is deleted again, this step fails,
  # and `llm` is not started. ollama itself checks each blob against its digest
  # as it downloads, so the manifest's digests pin the bytes.
  llm-fetch:
    image: ollama/ollama:0.40.16
    logging: *logging
    profiles: ["gpu-model"]
    restart: "no"
    volumes:
      - llm-ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      MODEL: ${VECTORA_LLM_MODEL:-nemotron-3.5-bolt:e4b-q8_0}
      FINGERPRINT: ${VECTORA_LLM_FINGERPRINT:-9ee0607b4740d965e86dd24cc08bdca68c5ceb9405447c57e5acec91dfccb2ce}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama serve >/tmp/serve.log 2>&1 &
        serve=$$!
        trap 'kill $$serve 2>/dev/null || true' EXIT
        i=0; until ollama list >/dev/null 2>&1; do i=$$((i+1)); [ $$i -gt 60 ] && { cat /tmp/serve.log; exit 1; }; sleep 1; done
        echo "Pulling $$MODEL (about 10 GB the first time)"
        ollama pull "$$MODEL"
        name=$${MODEL%%:*}; tag=$${MODEL#*:}
        manifest="/root/.ollama/models/manifests/registry.ollama.ai/library/$$name/$$tag"
        got=$$(grep -o 'sha256:[0-9a-f]\{64\}' "$$manifest" | sort -u | sha256sum | cut -d' ' -f1)
        if [ "$$got" != "$$FINGERPRINT" ]; then
          echo "$$MODEL does not match VECTORA_LLM_FINGERPRINT (got $$got); deleting it, nothing served"
          ollama rm "$$MODEL" || rm -f "$$manifest"
          exit 1
        fi
        echo "$$MODEL matches its pin; llm may serve it at http://llm:8086/v1"

volumes:
  llm-ollama:
  ollama-models:
  db-data:
  redis-queue-data:
  sites:
  logs:
