# Replaces /etc/nginx/snippets/security_headers.conf from the frappe_docker
# image, mounted read-only by the `frontend` service in docker-compose.yml.
#
# Why override a security snippet to ship a PWA header: this file is the only
# include point nginx.conf offers inside the generated server block. That block
# is written at container start by nginx-entrypoint.sh from a template baked
# into the image, so the alternative is forking ~90 lines of upstream config
# and re-inheriting every drift in it. Five lines we must keep verbatim is the
# cheaper hostage.
#
# ⚠ The first five lines are copied from the image (frappe_docker). If a base
# image bump changes them, this file silently pins the old set — diff it against
# the container's copy when upgrading:
#
#   docker compose exec frontend cat /etc/nginx/snippets/security_headers.conf
#
# $vectora_xfo / $vectora_csp come from conf.d/00-vectora-csp.conf, which is
# mounted alongside this file: both are empty for /crm-form/ so the embeddable
# web form can state its own framing policy. See that file for why.
add_header X-Frame-Options $vectora_xfo always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;

# Departures from the image's set, on purpose:
# - X-XSS-Protection is gone: no current browser implements the auditor, and
#   "1; mode=block" introduced its own leaks in the ones that did.
# - Permissions-Policy turns off the device APIs the CRM never asks for, so a
#   script that slipped in could not either. Microphone stays available: the
#   Twilio voice client needs it for in-browser calls.
# - frame-ancestors is the CSP form of X-Frame-Options; browsers that speak
#   CSP prefer it. Same value: SAMEORIGIN is 'self'.
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy $vectora_csp always;

# Lets the service worker at /assets/crm/frontend/sw.js claim the /crm scope.
# A worker's scope is capped at the directory it is served from unless the
# response says otherwise, and the app lives at /crm, not under /assets — so
# without this the worker registers into a scope containing no pages and the
# app has no offline shell and no install prompt.
#
# nginx has no per-file add_header without its own location block, so this
# lands on every response from the server. It is inert anywhere but the worker
# script: the header is only read by the service worker registration algorithm.
# The value is /crm rather than / deliberately — a root scope would let the
# worker intercept /app and /login too.
add_header Service-Worker-Allowed "/crm" always;

# Do NOT add `types { application/manifest+json webmanifest; }` here to fix the
# manifest's Content-Type. A types block in this context REPLACES the inherited
# mime.types map rather than extending it; measured in a scratch container off
# this image, .js and .css then serve as application/octet-stream, which the
# X-Content-Type-Options: nosniff above turns into a refusal to execute them.
# The manifest currently serves as application/octet-stream and Chrome parses it
# anyway -- it reads rel="manifest", not the type. Fixing it properly means
# editing mime.types, which is a whole extra file to hold hostage for a cosmetic
# warning.
