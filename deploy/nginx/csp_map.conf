# Mounted into /etc/nginx/conf.d/, which nginx includes in the `http` context.
# It defines two variables and nothing else; the server block that uses them is
# the one frappe_docker's entrypoint generates.
#
# Why they exist: the public web form is meant to be embedded on a customer's
# own site, and a Sales Manager lists the domains allowed to do it in Settings.
# frappe emits that as the page's own Content-Security-Policy. But the server
# already sent `frame-ancestors 'self'` and `X-Frame-Options: SAMEORIGIN`, and
# neither can be relaxed by a later header -- a browser enforces every framing
# rule it is sent, so the effective policy was their intersection, 'self'. The
# iframe snippet the settings page hands out was refused everywhere it was
# used, and the setting looked configurable while doing nothing.
#
# nginx omits a header whose value is an empty variable, so /crm-form/ gets
# neither of these and states its own policy. Everything else is unchanged.
map $uri $vectora_csp {
    ~^/crm-form/  "";
    default       "frame-ancestors 'self'";
}

map $uri $vectora_xfo {
    ~^/crm-form/  "";
    default       "SAMEORIGIN";
}
