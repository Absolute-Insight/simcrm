# Dependabot version updates. Security updates are enabled separately at the
# repo level and fire regardless of this schedule.
#
# Weekly and grouped on purpose: a Monday batch of minor/patch bumps is one
# review; ten single-dependency PRs spread over a week is ten. Majors stay
# ungrouped so a breaking bump is a deliberate decision, never a rider on a
# routine batch.
version: 2
updates:
  # Every action is pinned to a commit SHA with its release in a trailing
  # comment; Dependabot moves both together. "/" is .github/workflows. The
  # composite actions under .github/actions are listed as well because a SHA,
  # unlike the major tag they used to float on, goes stale unless something
  # proposes the next one.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # The images the production stack (deploy/) and the devcontainer run. They
  # are pinned by digest so that nothing moves under a running host -- which
  # also meant nothing ever proposed moving them, and a database image can
  # sit on an end-of-life series for as long as nobody looks.
  #
  # A PR from this block is a proposal, not a routine bump: nothing in CI boots
  # these images against real data. Read "Bumping the database image" in
  # deploy/README.md before merging one that touches `db`, and note that the
  # same MariaDB digest is repeated in three workflows this ecosystem does not
  # edit -- finish those in the same PR.
  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /.devcontainer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # Patch releases only. 10.6 -> 10.11 changes the system tables and needs
      # mariadb-upgrade and a rehearsed window; a major is a migration. Neither
      # is something to receive as a pull request. (10.6 is end-of-life
      # upstream: the move off it is a planned upgrade, tracked outside this
      # file, not something this block will propose.)
      - dependency-name: mariadb
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # The queue's append-only file is read by whatever redis starts next.
      - dependency-name: redis
        update-types:
          - version-update:semver-major
      # The model servers are pinned to the builds the agent evals were run
      # against (crm/agent/evals); a newer one is a different model server
      # until it has been measured. Bump these by hand, with the evals.
      - dependency-name: ollama/ollama
      - dependency-name: ggml-org/llama.cpp

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # Root package.json carries the Playwright e2e tooling only.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]
