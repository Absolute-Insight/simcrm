name: Frontend

on:
    pull_request:
        paths-ignore:
            - "**.md"
            - "**.py"
            - "**.txt"
            - "**.csv"
            - "**.po"
            - "**.pot"
            - ".github/workflows/server-tests.yml"
            - ".github/workflows/builds.yml"
    schedule:
        # Run every day at midnight UTC / 5:30 IST
        - cron: "0 0 * * *"
    workflow_dispatch:

concurrency:
    group: frontend-${{ github.event.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: yarn
                  cache-dependency-path: frontend/yarn.lock

            - name: Install dependencies
              run: cd frontend && yarn install --frozen-lockfile

            - name: ESLint
              run: cd frontend && npx eslint src --ext .js,.ts,.vue

            - name: Oxlint
              run: cd frontend && npx oxlint src

    build:
        name: Production Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: yarn
                  cache-dependency-path: frontend/yarn.lock

            - name: Install dependencies
              run: cd frontend && yarn install --frozen-lockfile

            - name: Build frontend
              # There is no bench in this job, so @framework/ui -- frappe's
              # unpublished UI package -- cannot resolve. Saying so explicitly
              # is the point: the build used to fall back to the no-op stub with
              # a console warning and report green, which means this gate has
              # never once compiled the real integration. It still doesn't, but
              # now the workflow records that rather than the resolver hiding
              # it, and a bench-based build fails loudly if the package moves.
              run: cd frontend && FRAMEWORK_UI_STUB=1 yarn build

    test:
        name: Unit Tests & Coverage
        runs-on: ubuntu-latest
        needs: lint

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: yarn
                  cache-dependency-path: frontend/yarn.lock

            - name: Run frontend tests
              uses: ./.github/actions/frontend-tests
              with:
                  node-version: "24"
                  enable-coverage: "true"

            - name: Upload coverage artifact
              if: github.base_ref == 'develop' || github.ref_name == 'develop'
              uses: ./.github/actions/upload-coverage
              with:
                  artifact-name: coverage-frontend
                  coverage-path: frontend/coverage/lcov.info

    coverage:
        name: Coverage Wrap Up
        needs: test
        if: github.base_ref == 'develop' || github.ref_name == 'develop'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Download artifacts
              uses: actions/download-artifact@v8

            - name: Publish coverage to Codecov
              uses: ./.github/actions/publish-codecov
              with:
                  name: Frontend
                  token: ${{ secrets.CODECOV_TOKEN }}
