name: Server

on:
    # On push as well as pull_request: builds.yml publishes the image customers
    # run from a push to main, and its guard can only require checks that
    # exist on that commit. A pull_request-only suite is invisible there. No
    # paths-ignore on push -- the guard needs the check present on every
    # commit it might publish, not only on commits that touched Python.
    push:
        branches:
            - main
            - develop
    pull_request:
        paths-ignore:
            - "**.css"
            - "**.js"
            - "**.md"
            - "**.html"
            - "**.csv"
            - "**.po"
            - "**.pot"
    schedule:
        # Run everday at midnight UTC / 5:30 IST
        - cron: "0 0 * * *"
env:
    CRM_BRANCH: ${{ github.base_ref || github.ref_name }}

concurrency:
    # event.number is empty on push, so without the fallback every push to
    # every branch shared one group and cancelled the run before it.
    group: develop-crm-${{ github.event.number || github.ref }}
    cancel-in-progress: true

jobs:
    setup:
        name: Resolve frappe matrix
        runs-on: ubuntu-latest
        outputs:
            frappe-refs: ${{ steps.resolve.outputs.refs }}
        steps:
            - name: Clone
              uses: actions/checkout@v7

            - name: Resolve frappe ref
              id: resolve
              run: |
                  # One lane, on the one frappe this project pins. The inherited
                  # mapping sent the main lane to version-15/16, which this fork
                  # cannot run on -- pyproject requires frappe >=16.0.0-dev --
                  # so the clone failed outright with "Remote branch version-16
                  # not found in upstream origin".
                  #
                  # It stayed hidden because this suite ran only on
                  # pull_request, and pull requests target develop. Adding the
                  # push trigger so builds.yml's guard could require this check
                  # is what finally ran the main lane, and it failed on the
                  # first release that needed it -- the same "green only by
                  # never running" this fork already fixed in
                  # migration-test.yml.
                  #
                  # The value is a label only: it names the job and the coverage
                  # artifact. install.sh resolves the actual source from
                  # scripts/frappe-pin.env, so this cannot select a frappe that
                  # differs from the one the image is built against.
                  source scripts/frappe-pin.env
                  echo "refs=[\"${FRAPPE_REF:0:12}\"]" >> "$GITHUB_OUTPUT"

    test:
        name: Tests (frappe ${{ matrix.frappe-ref }})
        needs: setup
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                frappe-ref: ${{ fromJson(needs.setup.outputs.frappe-refs) }}

        services:
            mysql:
                image: mariadb:10.6
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

        steps:
            - name: Clone
              uses: actions/checkout@v7

            - name: Setup environment
              uses: ./.github/actions/setup-server-env
              with:
                  python-version: "3.14"
                  node-version: "24"
                  type: "server"
                  # erpnext on the release lanes only -- it is not needed to
                  # prove the app works, and its bootstrap is the slowest part
                  # of the job. The old `!= 'version-16'` guard went with the
                  # stable lane it was written for.
                  install-erpnext: ${{ github.base_ref == 'main-hotfix' || github.base_ref == 'main' }}

            - name: Run server tests
              uses: ./.github/actions/run-server-tests
              with:
                  bench-path: "/home/runner/frappe-bench"
                  site: "test_site"
                  app: "crm"
                  enable-coverage: "true"
                  type: "server"
                  ci-build-id: ${{ github.run_id }}

            - name: Persist coverage artifact
              if: github.base_ref == 'develop' || github.ref_name == 'develop'
              uses: ./.github/actions/upload-coverage
              with:
                  artifact-name: coverage-${{ matrix.frappe-ref }}
                  coverage-path: /home/runner/frappe-bench/sites/coverage.xml

    # One check with a fixed name, whatever the matrix resolved to. The matrix
    # job carries the frappe commit in its name ("Tests (frappe e2e1006be484)"), so
    # builds.yml's guard cannot name it directly without breaking the next time
    # the matrix changes; it names this one instead. `always()` so it
    # still reports when a matrix leg fails -- a skipped job is no verdict,
    # and the guard treats absence as unpublishable.
    server-tests:
        name: Server Tests
        needs: test
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report the matrix result
              env:
                  RESULT: ${{ needs.test.result }}
              run: |
                  echo "matrix result: $RESULT"
                  [ "$RESULT" = "success" ]

    coverage:
        name: Coverage Wrap Up
        needs: test
        if: github.base_ref == 'develop' || github.ref_name == 'develop'
        runs-on: ubuntu-latest
        steps:
            - name: Clone
              uses: actions/checkout@v7

            - name: Download artifacts
              uses: actions/download-artifact@v8

            - name: Publish coverage
              uses: ./.github/actions/publish-codecov
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
