name: Image Build Inputs

# builds.yml runs only on a push to main or a tag, so everything it depends on
# was previously first exercised during a release: an upstream Containerfile
# edit, a base image that no longer suits the pinned frappe, a sed that stopped
# matching. All of those produced a failed or -- worse -- a quietly wrong
# release rather than a red check.
#
# This runs the same scripts builds.yml runs, on every PR that touches a pin or
# the scripts themselves, without building or pushing anything. About a minute.
on:
  pull_request:
    paths:
      - ".github/helper/image-pins.env"
      - ".github/helper/prepare-containerfile.sh"
      - ".github/helper/check-build-toolchain.sh"
      - ".github/workflows/builds.yml"
      - ".github/workflows/image-build-inputs.yml"
      - "scripts/frappe-pin.env"
      - "scripts/fetch-frappe.sh"
      - "scripts/frappe-whatsapp-pin.env"
      - "scripts/fetch-frappe-whatsapp.sh"
      - "deploy/docker-compose.yml"
      - "deploy/docker-compose.override.yml"
      - ".github/helper/promote-image.sh"
      - ".github/helper/set-image-tags.sh"
      - ".github/helper/test-set-image-tags.sh"
      - ".github/helper/test-promote-image.sh"
      - ".github/helper/release-bump-parent.py"
      - ".github/helper/test-release-bump-parent.sh"
      - ".github/helper/stage-app-source.sh"
      - ".github/helper/test-deploy-compose.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-build-inputs-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  inputs:
    name: Image Build Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Load image pins
        run: |
          set -euo pipefail
          set -a; source .github/helper/image-pins.env; set +a
          for v in FRAPPE_DOCKER_REF FRAPPE_BUILD_IMAGE FRAPPE_BASE_IMAGE; do
            [ -n "${!v:-}" ] || { echo "::error::$v is empty in image-pins.env"; exit 1; }
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Check out frappe_docker at the pin
        uses: actions/checkout@v7
        with:
          repository: frappe/frappe_docker
          path: builds
          ref: ${{ env.FRAPPE_DOCKER_REF }}

      - name: Fetch the pinned frappe
        # Only the metadata is read here (package.json engines,
        # pyproject requires-python), but it is the same fetch builds.yml
        # does, so a broken pin fails here too.
        run: bash scripts/fetch-frappe.sh builds/frappe-src

      - name: Fetch the pinned frappe_whatsapp
        run: bash scripts/fetch-frappe-whatsapp.sh builds/app-src/frappe_whatsapp

      - name: Stage this commit as the app source
        # The same call builds.yml makes. The image is built from the commit
        # that was checked out and verified, not from wherever its branch
        # points by the time the Containerfile runs -- and the script that
        # arranges that is otherwise first run by a release.
        run: |
          set -euo pipefail
          bash .github/helper/stage-app-source.sh builds/app-src/crm "$GITHUB_REF_NAME" "$GITHUB_SHA"
          # What bench will do with it inside the builder.
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" builds/app-src/crm "$RUNNER_TEMP/bench-clone"
          [ "$(git -C "$RUNNER_TEMP/bench-clone" rev-parse HEAD)" = "$GITHUB_SHA" ]
          # And a checkout that is not the commit asked for is refused. Its
          # output is dropped: the refusal prints ::error:: lines, which would
          # show as annotations on a step that passed.
          if bash .github/helper/stage-app-source.sh "$RUNNER_TEMP/wrong/crm" x 0000000000000000000000000000000000000000 >/dev/null 2>&1; then
            echo "::error::stage-app-source.sh staged a commit other than the one it was told to"
            exit 1
          fi

      - name: Check the builder image can build the pinned frappe
        run: bash .github/helper/check-build-toolchain.sh builds/frappe-src

      - name: Prepare the Containerfile
        # Proves both rewrites still match upstream's file at the pinned
        # ref. This is the check that would have caught the `base` stage
        # being added while only `builder` was rewritten.
        run: bash .github/helper/prepare-containerfile.sh builds/images/layered/Containerfile

      - name: deploy/ parses with no optional credentials
        # builds.yml boots this compose file from a generated .env that
        # carries only the required keys. Compose interpolates EVERY
        # service's variables at parse time, before it filters by
        # profile, so a `${FOO:?}` on an opt-in service breaks every
        # command in deploy/ for everyone who does not use it -- which is
        # how v3.14.0 published an image its own smoke test never booted,
        # and took the QA stack down with it.
        #
        # Parsing with nothing but the required keys set is the whole
        # test: an optional service that demands a value at parse time
        # cannot pass it.
        run: |
          set -euo pipefail
          cat > /tmp/minimal.env <<'EOF'
          VECTORA_IMAGE=ghcr.io/absolute-insight/simcrm
          VECTORA_TAG=stable
          SITE_NAME=smoke.localhost
          DB_ROOT_PASSWORD=smoke-root-pw
          ADMIN_PASSWORD=smoke-admin-pw
          EOF
          cd deploy
          for profiles in "" "--profile offsite"; do
            echo "::group::docker compose config ${profiles:-(no profiles)}"
            docker compose -f docker-compose.yml --env-file /tmp/minimal.env \
              $profiles config --quiet
            echo "::endgroup::"
          done
          echo "deploy/docker-compose.yml parses with only the required keys set."

      - name: deploy/ keeps the properties a production host relies on
        # Config only -- nothing is started. The memory ceilings and what
        # sits under them, the backup healthchecks, what the offsite copy
        # leaves out, how create-site tells a site from a directory; and a
        # syntax check of every script embedded in the file, which are
        # strings in YAML that no linter otherwise reads before a host does.
        run: bash .github/helper/test-deploy-compose.sh

      - name: Only a pure version bump inherits its parent's checks
        # The build guard's one exemption, decided on the diff. builds.yml
        # cannot be run from a PR, so this is where that rule is exercised
        # before a release depends on it.
        run: bash .github/helper/test-release-bump-parent.sh

      - name: Release tagging promotes what it verified
        # builds.yml runs only on a push to main or a tag, so until this
        # existed the promotion step could not be executed anywhere but a
        # live release -- and a release is a bad place to discover that a
        # shell loop mishandles its input. It is not hypothetical: the
        # first draft of promote-image.sh dropped the last tag of the
        # list, so a release would have published the version tag and
        # silently left `stable` behind. These checks caught it.
        #
        # Nothing is pushed and no registry credentials are needed: the
        # checks run in DRY_RUN or against a fake `docker`. What they
        # cover is the part that was wrong: which tags get promoted, that
        # a non-main ref never promotes `stable`, that malformed input
        # fails loudly instead of becoming --tag "" -- and the two
        # refusals: an existing vX.Y.Z tag is never re-pointed, and
        # `stable` never moves to an older release.
        run: bash .github/helper/test-promote-image.sh

      - name: Only a tag build publishes :stable
        # Every release produces two builds -- semantic-release pushes the
        # version bump to main (one build) and then the tag (another) --
        # from DIFFERENT commits, since the main build predates the bump.
        # Both used to write `stable`, so whichever finished last won, and
        # a main build landing last left `stable` on an image whose
        # crm/__init__.py still named the previous version. Nothing in the
        # release output showed it; only comparing digests did.
        run: bash .github/helper/test-set-image-tags.sh
