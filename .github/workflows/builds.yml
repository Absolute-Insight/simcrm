name: Build Container Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

# The repo's default workflow token is read-only; without packages:write the
# ghcr push is rejected after a full multi-arch build.
permissions:
  contents: read
  packages: write
  checks: read

jobs:
  guard:
    name: Require green checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # This workflow publishes the image customers run, and it fires on push
      # to main and on any tag -- neither of which runs the test suite. A
      # workflow_dispatch of a red commit was publishable outright. So: refuse
      # to build a commit whose checks are absent or failing.
      #
      # Checks are keyed by commit SHA, so a tag build sees the runs from when
      # that same commit was pushed to main. They may still be in flight when
      # the tag lands, which is why this waits rather than reading once.
      #
      # A release tag is the exception, and it is not a corner case -- it is
      # every release. semantic-release commits the version bump itself and
      # tags *that* commit, pushing it with the workflow's GITHUB_TOKEN. Pushes
      # made with that token deliberately do not trigger workflows, so the test
      # suites never run on a bump commit and never will: waiting on it is
      # waiting for something nothing will produce. Before this step resolved
      # the parent, `builds.yml --ref vX.Y.Z` sat for the full 40 minutes and
      # then refused the release it was dispatched to publish. (v3.0.0 built
      # only because it predates this guard by a day.)
      #
      # A bump commit is safe to inherit from because of what it contains: one
      # sed of the version string in crm/__init__.py. The step verifies exactly
      # that -- subject and file list both -- and refuses to walk the parent of
      # anything else, so this cannot become a way to publish untested code.
      - name: Wait for this commit's checks to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          # Every one of these must actually run on a push to main -- a
          # workflow that triggers only on pull_request is absent here and
          # cannot be required. One check name per line, exactly as it appears
          # in the checks UI. "Server Tests" is the fixed-name wrap-up job in
          # server-tests.yml, not the matrix legs, whose names vary by branch.
          REQUIRED: |
            Playwright E2E Tests
            Server Tests
            Unit Tests & Coverage
        run: |
          set -euo pipefail

          # Resolve which commit's checks stand for this build. One API call,
          # read through gh's own --jq so this needs no jq on the runner.
          meta=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '
            [ (.commit.message | split("\n")[0]),
              ([.files[]?.filename] | sort | join(",")),
              (.parents[0].sha // "") ] | @tsv')
          IFS=$'\t' read -r subject files parent <<<"$meta"

          if [ "$files" = "crm/__init__.py" ] \
             && printf '%s' "$subject" | grep -q '^chore(release):' \
             && [ -n "$parent" ]; then
            echo "$SHA is a release version bump ($subject)."
            echo "It touches only crm/__init__.py, and a token-pushed commit never"
            echo "gets its own test runs -- inheriting checks from parent $parent."
            SHA="$parent"
          fi

          deadline=$(( $(date +%s) + 40 * 60 ))

          while :; do
            # Exclude this workflow's own jobs, or it would wait on itself.
            #
            # One row per check NAME, keeping the newest run -- which is what
            # GitHub's own required-checks UI shows, and it matters here. The
            # test workflows set `cancel-in-progress: true`, so any second push
            # to a ref supersedes the first and leaves a `cancelled` run behind
            # on that commit forever. Reading every run flat, a superseded
            # attempt vetoed the release permanently: re-dispatching could not
            # help, because the cancelled row never goes away. Two pushes in
            # quick succession were enough to make a commit unpublishable.
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '[ .check_runs[]
                      | select(.name != "Require green checks" and .name != "Build") ]
                    | group_by(.name)
                    | map( sort_by(.started_at, (.id|tostring)) | last )
                    | .[] | [.name, .status, (.conclusion // "pending")] | @tsv')

            # `cancelled` is deliberately absent from this list. A cancelled
            # newest run is not a failed test, it is no verdict -- so fall
            # through and keep waiting rather than refusing. If nothing ever
            # replaces it the deadline below still refuses, which is the right
            # answer for a commit with no evidence, reached the honest way.
            if bad=$(printf '%s\n' "$runs" | awk -F'\t' '
                  $3 ~ /^(failure|timed_out|action_required|stale)$/ { print $1 " (" $3 ")" }'
                ) && [ -n "$bad" ]; then
              echo "::error::Refusing to publish: these checks did not pass on $SHA"
              printf '%s\n' "$bad"
              exit 1
            fi

            # Every required name must have a newest run that completed
            # successfully; the first one that has not keeps us waiting.
            missing=""
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              if ! printf '%s\n' "$runs" | grep -qP "^\Q$name\E\tcompleted\tsuccess$"; then
                missing="$name"
                break
              fi
            done <<<"$REQUIRED"

            if [ -z "$missing" ]; then
              echo "All required checks passed on $SHA:"
              printf '%s\n' "$REQUIRED" | sed '/^$/d; s/^/  /'
              printf '%s\n' "$runs"
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for '$missing' on $SHA. Checks seen:"
              printf '%s\n' "${runs:-<none>}"
              echo "::error::A commit with no test run is not publishable."
              exit 1
            fi
            echo "Waiting for '$missing' on $SHA ..."
            sleep 30
          done

  build:
    name: Build
    needs: guard

    runs-on: ubuntu-latest
    # A multi-arch build under QEMU is long; the default 360 is longer than
    # anything useful. Builds of the same ref queue rather than cancel, so a
    # release tag build is never killed by a main push landing behind it.
    timeout-minutes: 90
    concurrency:
      group: builds-${{ github.ref }}
      cancel-in-progress: false

    # Third-party actions are pinned to commit SHAs: a moving major tag is a
    # supply-chain write into the job that holds the packages:write token.
    # The trailing comment is the release the SHA was resolved from.
    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load image pins
        # frappe_docker's ref and both base-image digests, from the file the
        # PR-time check (image-build-inputs.yml) reads too, so a bump cannot
        # reach a release without that check having proved it.
        run: |
          set -euo pipefail
          set -a; source .github/helper/image-pins.env; set +a
          # An unset value would make the checkout below silently take
          # frappe_docker's default branch, which is the drift this pin exists
          # to stop -- so refuse rather than default.
          for v in FRAPPE_DOCKER_REF FRAPPE_BUILD_IMAGE FRAPPE_BASE_IMAGE; do
            [ -n "${!v:-}" ] || { echo "::error::$v is empty in image-pins.env"; exit 1; }
            echo "$v=${!v}" >> "$GITHUB_ENV"
            echo "$v=${!v}"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Branch
        # Build THIS repository at the ref being built — inherited config
        # pointed at upstream frappe/crm, so the image this workflow published
        # would have contained none of this fork's code.
        #
        # Frappe comes from the commit pinned in scripts/frappe-pin.env, the
        # same one server-tests.yml, migration-test.yml, ui-tests.yml and the
        # devcontainer use -- so the image customers run is built against
        # exactly the framework the suite proved. Upstream develop moves, so
        # two builds a week apart shipped different framework code with no way
        # to reproduce the earlier one, which is the question a customer bug
        # report actually asks.
        #
        # FRAPPE_PATH is a path inside the builder image, not a URL. The
        # Containerfile runs `bench init --frappe-branch=$FRAPPE_BRANCH
        # --frappe-path=$FRAPPE_PATH`, and bench turns that into `git clone
        # --branch`, which takes a branch or a tag and never a commit. So the
        # pinned commit is cloned into the build context below and copied in,
        # parked on a local branch bench can name.
        run: |
          export APPS_JSON='[{"url": "https://github.com/'"$GITHUB_REPOSITORY"'","branch": "'"$GITHUB_REF_NAME"'"}]'
          # Passed to the build as a secret, not a build-arg -- see the
          # `secrets:` block below for why that distinction was load-bearing.
          echo "APPS_JSON=$APPS_JSON" >> $GITHUB_ENV
          source scripts/frappe-pin.env
          echo "FRAPPE_PATH=/home/frappe/frappe-src" >> $GITHUB_ENV
          echo "FRAPPE_BRANCH=$FRAPPE_PIN_BRANCH" >> $GITHUB_ENV

      - name: Set Image Tag
        # Registry paths must be lowercase; github.repository is not.
        #
        # Three tags, and only one of them is stable in the sense of unchanging:
        #   sha-<short>  immutable, always exactly this commit
        #   <ref_name>   main, or the release tag — the release tag is immutable
        #                in practice because the git tag is; :main is not
        #   stable       a moving pointer to the newest main build
        #
        # A deployment that pins :stable cannot say what it is running, and two
        # `docker compose pull`s a week apart give different systems with no way
        # to reproduce the earlier one. sha- gives every build a name that will
        # still mean the same thing later, which is what a customer bug report
        # needs.
        #
        # :stable is written only by a build of main or of a release tag
        # (v*), which is always cut from main. It used to be written by every
        # build, so a `gh workflow run builds.yml --ref develop` -- the
        # documented way to rehearse -- silently pointed "newest main" at a
        # develop commit. Any other ref gets the two immutable-ish tags only.
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha_tag="sha-$(git rev-parse --short HEAD)"
          tags="$repo:$GITHUB_REF_NAME,$repo:$sha_tag"
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) tags="$tags,$repo:stable" ;;
          esac
          echo "IMAGE_TAGS=$tags" >> $GITHUB_ENV
          echo "IMAGE_SHA_TAG=$sha_tag" >> $GITHUB_ENV
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "tags: $tags"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frappe/frappe_docker
          path: builds
          # Pinned, not main. This is third-party source that the next step
          # rewrites by sed, and this workflow runs only on a push to main or a
          # tag -- so an upstream edit would not surface until a release, at the
          # moment it is least welcome. The pin and the bump instructions live
          # in .github/helper/image-pins.env.
          ref: ${{ env.FRAPPE_DOCKER_REF }}

      - name: Put the pinned frappe in the build context
        # Cloned here rather than fetched by the Containerfile so the image is
        # built from a commit, not from wherever a branch points today.
        # frappe_docker's .dockerignore lists only README/LICENSE/.gitignore/
        # compose*.yaml, so this directory does reach the build.
        run: |
          set -euo pipefail
          bash scripts/fetch-frappe.sh builds/frappe-src
          git -C builds/frappe-src log -1 --format='context frappe: %H'

      - name: Check the builder image can build the pinned frappe
        # The two pins move independently -- frappe by commit, the builder image
        # by digest -- and nothing used to check they still work together. Node
        # is the live example: the pinned frappe declares engines ">=24", and a
        # builder still on 22 fails inside `bench init` on a rollback prompt no
        # build can answer.
        run: bash .github/helper/check-build-toolchain.sh builds/frappe-src

      - name: Prepare the Containerfile
        # Copies the pinned frappe into the builder stage and points both base
        # images at pinned digests, asserting each rewrite. The same script runs
        # on every PR via image-build-inputs.yml, which is the only reason a
        # rewrite that stopped applying would be caught before a release.
        run: bash .github/helper/prepare-containerfile.sh builds/images/layered/Containerfile

      # One build, one manifest, both platforms. The inherited per-arch matrix
      # pushed two single-arch images to the SAME tags, so whichever job
      # finished last won and the other architecture pulled an image it could
      # not exec.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          context: builds
          file: builds/images/layered/Containerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_TAGS }}
          build-args: |
            "FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}"
            "FRAPPE_PATH=${{ env.FRAPPE_PATH }}"
          # The app list reaches the build as a SECRET, because that is what the
          # Containerfile reads:
          #
          #   RUN --mount=type=secret,id=apps_json,target=/opt/frappe/apps.json
          #     if [ -f /opt/frappe/apps.json ] && [ -s /opt/frappe/apps.json ]
          #       export APP_INSTALL_ARGS="--apps_path=/opt/frappe/apps.json"
          #     bench init ${APP_INSTALL_ARGS} ...
          #
          # This was an APPS_JSON_BASE64 build-arg, which upstream stopped
          # reading when it moved to a secret mount. Nothing errored: the arg
          # was accepted and ignored, apps.json was never created, the guard
          # fell through with APP_INSTALL_ARGS empty, and `bench init` built a
          # bench containing frappe and nothing else. Every image published so
          # far -- v2.0.0 through v3.1.4, and :stable -- ships without the CRM
          # app, which is why `create-site --install-app crm` has never been
          # got past. Confirmed by listing the published layers: the whole
          # `frappe-bench/apps/` tree is `frappe/` alone.
          #
          # Raw JSON, not base64: bench reads the mounted file directly.
          secrets: |
            apps_json=${{ env.APPS_JSON }}

      # The bug above was invisible for five releases because a build that
      # installs no apps still succeeds -- it just produces a frappe bench with
      # nothing in it. Nothing downstream noticed, because nobody had booted the
      # image. So assert the one property that makes this image worth
      # publishing, against the artifact that was actually pushed.
      - name: Refuse an image that does not contain the app
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA_TAG }}"
          apps=$(docker run --rm --entrypoint sh "$ref" -c 'ls apps/' | tr -d '\r')
          echo "apps in image: $(echo "$apps" | tr '\n' ' ')"
          if ! echo "$apps" | grep -qx crm; then
            echo "::error::$ref contains no 'crm' app -- bench init installed frappe only."
            echo "::error::Check that apps.json reaches the build as the 'apps_json' secret."
            exit 1
          fi
          echo "$ref contains the crm app."
