name: Build Container Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

# The repo's default workflow token is read-only; without packages:write the
# ghcr push is rejected after a full multi-arch build.
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Branch
        # Build THIS repository at the ref being built — inherited config
        # pointed at upstream frappe/crm, so the image this workflow published
        # would have contained none of this fork's code.
        #
        # FRAPPE_BRANCH is develop because that is the only combination the
        # test suite runs against (see server-tests.yml: develop tracks frappe
        # develop). Shipping the app on frappe version-15 would ship a pairing
        # no test has ever exercised.
        run: |
          export APPS_JSON='[{"url": "https://github.com/'"$GITHUB_REPOSITORY"'","branch": "'"$GITHUB_REF_NAME"'"}]'
          echo "APPS_JSON_BASE64=$(echo $APPS_JSON | base64 -w 0)" >> $GITHUB_ENV
          echo "FRAPPE_BRANCH=develop" >> $GITHUB_ENV

      - name: Set Image Tag
        # Registry paths must be lowercase; github.repository is not.
        #
        # Three tags, and only one of them is stable in the sense of unchanging:
        #   sha-<short>  immutable, always exactly this commit
        #   <ref_name>   main, or the release tag — the release tag is immutable
        #                in practice because the git tag is; :main is not
        #   stable       a moving pointer to the newest main build
        #
        # A deployment that pins :stable cannot say what it is running, and two
        # `docker compose pull`s a week apart give different systems with no way
        # to reproduce the earlier one. sha- gives every build a name that will
        # still mean the same thing later, which is what a customer bug report
        # needs.
        run: |
          echo "IMAGE_TAG=stable" >> $GITHUB_ENV
          echo "IMAGE_SHA_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          repository: frappe/frappe_docker
          path: builds

      # One build, one manifest, both platforms. The inherited per-arch matrix
      # pushed two single-arch images to the SAME tags, so whichever job
      # finished last won and the other architecture pulled an image it could
      # not exec.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: builds
          file: builds/images/layered/Containerfile
          platforms: linux/amd64,linux/arm64
          tags: >
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.ref_name }},
            ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA_TAG }},
            ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          build-args: |
            "FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}"
            "APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}"
