name: Build Container Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

# The repo's default workflow token is read-only; without packages:write the
# ghcr push is rejected after a full multi-arch build.
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Branch
        # Build THIS repository at the ref being built — inherited config
        # pointed at upstream frappe/crm, so the image this workflow published
        # would have contained none of this fork's code.
        #
        # Frappe comes from this fork's pinned `vectora` branch, not upstream's
        # develop. Upstream develop moves, so two builds a week apart shipped
        # different framework code with no way to reproduce the earlier one --
        # the question a customer bug report actually asks. `vectora` is frozen
        # at a known-good develop commit and advanced deliberately, which keeps
        # the exact pairing the test suite runs against (server-tests.yml also
        # builds against vectora).
        run: |
          export APPS_JSON='[{"url": "https://github.com/'"$GITHUB_REPOSITORY"'","branch": "'"$GITHUB_REF_NAME"'"}]'
          echo "APPS_JSON_BASE64=$(echo $APPS_JSON | base64 -w 0)" >> $GITHUB_ENV
          echo "FRAPPE_PATH=https://github.com/Absolute-Insight/frappe" >> $GITHUB_ENV
          echo "FRAPPE_BRANCH=vectora" >> $GITHUB_ENV

      - name: Set Image Tag
        # Registry paths must be lowercase; github.repository is not.
        #
        # Three tags, and only one of them is stable in the sense of unchanging:
        #   sha-<short>  immutable, always exactly this commit
        #   <ref_name>   main, or the release tag — the release tag is immutable
        #                in practice because the git tag is; :main is not
        #   stable       a moving pointer to the newest main build
        #
        # A deployment that pins :stable cannot say what it is running, and two
        # `docker compose pull`s a week apart give different systems with no way
        # to reproduce the earlier one. sha- gives every build a name that will
        # still mean the same thing later, which is what a customer bug report
        # needs.
        run: |
          echo "IMAGE_TAG=stable" >> $GITHUB_ENV
          echo "IMAGE_SHA_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          repository: frappe/frappe_docker
          path: builds

      # One build, one manifest, both platforms. The inherited per-arch matrix
      # pushed two single-arch images to the SAME tags, so whichever job
      # finished last won and the other architecture pulled an image it could
      # not exec.
      # frappe_docker's Containerfile spends FRAPPE_BRANCH twice: once to clone
      # frappe, and once as the tag of the builder base image
      # (frappe/build:${FRAPPE_BRANCH}). Upstream publishes that image for its
      # own branch names only, so a build arg of `vectora` would look for a tag
      # that does not exist. The builder is a toolchain -- node, python, wkhtml
      # -- not frappe source, so it is pinned separately here and the source
      # branch is passed on its own. (The toolchain image still moves; that is a
      # smaller exposure than the framework, and is noted in the checklist.)
      - name: Decouple the builder image from the frappe source branch
        run: |
          sed -i 's|^FROM ${FRAPPE_IMAGE_PREFIX}/build:${FRAPPE_BRANCH} AS builder|FROM ${FRAPPE_IMAGE_PREFIX}/build:develop AS builder|' \
            builds/images/layered/Containerfile
          grep -n 'AS builder' builds/images/layered/Containerfile

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: builds
          file: builds/images/layered/Containerfile
          platforms: linux/amd64,linux/arm64
          tags: >
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.ref_name }},
            ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA_TAG }},
            ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          build-args: |
            "FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}"
            "FRAPPE_PATH=${{ env.FRAPPE_PATH }}"
            "APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}"
