name: Regenerate POT file (translatable strings)
# Manual only. This is upstream's workflow and .github/helper/update_pot_file.sh
# still points at upstream: it sets the `upstream` remote to frappe/crm, pushes
# the generated branch there and opens the PR with `-R frappe/crm`. In this fork
# it cannot succeed -- it fails on `gh` having no token, and the one thing a
# token would buy is an attempt to push a branch to a repository we do not own.
#
# It used to run every Sunday at 09:30 UTC and attach a `failure` check to
# whatever commit was develop's HEAD at the time. That is not cosmetic:
# builds.yml refuses to publish a commit carrying any failing check, and a
# release bump inherits its parent's checks -- so a Sunday cron could make the
# week's release unbuildable, which is what it did to 1fb427f09. Dropping the
# schedule leaves the workflow runnable by hand for whoever fixes the script to
# target this fork, without it vetoing releases in the meantime.
on:
  workflow_dispatch:

jobs:
  regenerate-pot-file:
    name: Regenerate POT file
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ["develop"]
    permissions:
      contents: write

    steps:
        - name: Checkout
          uses: actions/checkout@v7
          with:
            ref: ${{ matrix.branch }}

        - name: Setup Python
          uses: actions/setup-python@v7
          with:
            python-version: "3.14"

        - name: Setup Node
          uses: actions/setup-node@v7
          with:
            node-version: 24

        - name: Run script to update POT file
          run: |
            bash ${GITHUB_WORKSPACE}/.github/helper/update_pot_file.sh
          env:
            GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            BASE_BRANCH: ${{ matrix.branch }}
