name: Generate Semantic Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

# semantic-release creates the GitHub Release and pushes the version-bump
# commit; contents:write covers both on an unprotected main.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: this job holds a contents:write token, and a
      # moving major tag is a write into it. Trailing comment = resolved release.
      - name: Checkout Entire Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup dependencies
        # conventional-changelog-conventionalcommits backs the preset in
        # .releaserc; semantic-release only bundles the angular preset, which
        # ignores the `feat!:`/`fix!:` breaking-change shorthand outright.
        # Pinned to major 9: v10 loads cleanly against release-notes-generator
        # 14 but its writer silently renders an empty body — v3.0.0 shipped
        # with headerless notes that way. Unpin only after a release dry-run
        # shows populated sections.
        run: |
          npm install @semantic-release/git @semantic-release/exec conventional-changelog-conventionalcommits@9 --no-save
      - name: Create Release
        # RELEASE_TOKEN (a PAT) is only needed once main is branch-protected;
        # until then the workflow token with contents:write does everything
        # semantic-release asks of it. The fallback keeps the release runnable
        # on a repo where that secret was never configured — which this one is.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GIT_AUTHOR_NAME: "Frappe PR Bot"
          GIT_AUTHOR_EMAIL: "developers@frappe.io"
          GIT_COMMITTER_NAME: "Frappe PR Bot"
          GIT_COMMITTER_EMAIL: "developers@frappe.io"
        run: npx semantic-release